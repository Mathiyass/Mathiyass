name: Generate All Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *" # Every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'profile-summary-card-output/**'
      - '.github/workflows/**'

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p dist

      - name: Set up Node.js for Header Generation
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compile Dynamic Header SVG
        run: node build-header.js || echo "Header build failed but continuing"

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Pacman Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
      
      - name: Move Pacman to dist
        run: mv pacman-contribution-graph*.svg dist/ || echo "Pacman generation failed but continuing"

      - name: Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Move 3D Calendar to dist
        run: mv profile-3d-contrib/*.svg dist/ || echo "3D Calendar generation failed but continuing"

      - name: Generate Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Mathiyass
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/London
          config_padding: 0, 8
          config_output: svg
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_stars: yes
          plugin_stars_limit: 4
          # Output directly to dist instead of committing to prevent conflicts
          output_action: none
          filename: metrics.svg

      - name: Move Metrics to dist
        run: mv metrics.svg dist/ || echo "Metrics generation failed but continuing"

      - name: Generate GitHub Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}

      - name: Move Summary Cards to dist
        run: |
          mkdir -p dist/cards
          cp -r profile-summary-card-output/* dist/cards/ || echo "Summary cards generation failed but continuing"

      - name: Push all assets to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "chore: update profile assets"

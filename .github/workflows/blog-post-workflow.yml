name: Latest Blog Post Workflow
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pull in Medium & Dev.to posts
        uses: gautamkrishnar/blog-post-workflow@v1
        continue-on-error: true
        with:
          feed_list: "https://medium.com/feed/@mathishaangirasa,https://dev.to/feed/mathishaangirasa"
          max_post_count: 5
          retry_count: 2
          retry_wait_time: 5

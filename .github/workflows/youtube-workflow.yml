name: Latest YouTube Videos Workflow
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-readme-with-youtube:
    name: Update this repo's README with latest videos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Pull in YouTube videos
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "YOUTUBE"
          channel_id: "UCxxxxxxxxxxxxxxx" # Replace with actual channel ID or use custom_value if known
          # attempting without channel_id first by using feed_list if possible, but this action is specific.
          # actually this action supports youtube_channel_id.
          # I will set a placeholder and ask user to update it or try to find it if it was in the readme.
          # The previous readme had a link to youtube.com/@mathiya. I'll use that handle if supported or leave a comment.
          # The action supports channel_id. I don't have it. I'll use a placeholder.
          channel_id: "UC_YOUR_CHANNEL_ID_HERE" 

<svg width="900" height="116" viewBox="0 0 900 116" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#080B10" />
    </linearGradient>

    <!-- Metallic Tier Gradients -->
    <linearGradient id="goldTier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="cyanTier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#00DFD8" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>

    <linearGradient id="purpleTier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879F9" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <linearGradient id="emeraldTier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="blueTier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <style>
      .b-title { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 10.5px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.5px; }
      .b-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.5px; fill: #8B949E; }
      .b-tier { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 8.5px; font-weight: 700; letter-spacing: 1.2px; }
      
      .corner-tick { stroke-width: 1.5; }
      
      .badge-anim {
        animation: floatBadge 3.5s ease-in-out infinite alternate;
      }
      .f1 { animation-delay: 0s; }
      .f2 { animation-delay: 0.4s; }
      .f3 { animation-delay: 0.8s; }
      .f4 { animation-delay: 1.2s; }
      .f5 { animation-delay: 1.6s; }

      .tier-glow {
        animation: pulseTier 2s ease-in-out infinite alternate;
      }

      @keyframes floatBadge {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-3px); }
      }
      @keyframes pulseTier {
        0% { opacity: 0.7; }
        100% { opacity: 1; filter: drop-shadow(0 0 5px currentColor); }
      }
    </style>
  </defs>

  <!-- 5 Chamfered Tactical Badges with Isolated Positioning Coordinates -->

  <!-- Badge 1: Systems Architect -->
  <g transform="translate(10, 8)">
    <g class="badge-anim f1">
      <polygon points="12,0 156,0 168,12 168,88 156,100 12,100 0,88 0,12" fill="url(#cardGradDark)" stroke="url(#goldTier)" stroke-width="1.2" />
      <line x1="0" y1="12" x2="12" y2="0" stroke="#FFE066" class="corner-tick" />
      <line x1="156" y1="100" x2="168" y2="88" stroke="#FFE066" class="corner-tick" />
      <g>
        <circle cx="84" cy="28" r="17" fill="rgba(245, 158, 11, 0.12)" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4, 4">
          <animateTransform attributeName="transform" type="rotate" from="0 84 28" to="360 84 28" dur="6s" repeatCount="indefinite" />
        </circle>
      </g>
      <text x="84" y="34" text-anchor="middle" font-size="16">🏛️</text>
      <text x="84" y="60" text-anchor="middle" class="b-title">SYSTEMS ARCHITECT</text>
      <text x="84" y="74" text-anchor="middle" class="b-sub">Distributed Scalability</text>
      <text x="84" y="88" text-anchor="middle" class="b-tier tier-glow" fill="#FBBF24">★ MASTER TIER ★</text>
    </g>
  </g>

  <!-- Badge 2: Multi-Agent AI -->
  <g transform="translate(188, 8)">
    <g class="badge-anim f2">
      <polygon points="12,0 156,0 168,12 168,88 156,100 12,100 0,88 0,12" fill="url(#cardGradDark)" stroke="url(#cyanTier)" stroke-width="1.2" />
      <line x1="0" y1="12" x2="12" y2="0" stroke="#67E8F9" class="corner-tick" />
      <line x1="156" y1="100" x2="168" y2="88" stroke="#67E8F9" class="corner-tick" />
      <g>
        <circle cx="84" cy="28" r="17" fill="rgba(0, 223, 216, 0.12)" stroke="#00DFD8" stroke-width="1" stroke-dasharray="4, 4">
          <animateTransform attributeName="transform" type="rotate" from="0 84 28" to="360 84 28" dur="6s" repeatCount="indefinite" />
        </circle>
      </g>
      <text x="84" y="34" text-anchor="middle" font-size="16">🤖</text>
      <text x="84" y="60" text-anchor="middle" class="b-title">MULTI-AGENT AI</text>
      <text x="84" y="74" text-anchor="middle" class="b-sub">Swarm &amp; Tool RAG</text>
      <text x="84" y="88" text-anchor="middle" class="b-tier tier-glow" fill="#00DFD8">★ MYTHIC TIER ★</text>
    </g>
  </g>

  <!-- Badge 3: WebGL & GLSL -->
  <g transform="translate(366, 8)">
    <g class="badge-anim f3">
      <polygon points="12,0 156,0 168,12 168,88 156,100 12,100 0,88 0,12" fill="url(#cardGradDark)" stroke="url(#purpleTier)" stroke-width="1.2" />
      <line x1="0" y1="12" x2="12" y2="0" stroke="#E879F9" class="corner-tick" />
      <line x1="156" y1="100" x2="168" y2="88" stroke="#E879F9" class="corner-tick" />
      <g>
        <circle cx="84" cy="28" r="17" fill="rgba(168, 85, 247, 0.12)" stroke="#A855F7" stroke-width="1" stroke-dasharray="4, 4">
          <animateTransform attributeName="transform" type="rotate" from="0 84 28" to="360 84 28" dur="6s" repeatCount="indefinite" />
        </circle>
      </g>
      <text x="84" y="34" text-anchor="middle" font-size="16">🎮</text>
      <text x="84" y="60" text-anchor="middle" class="b-title">WEBGL 2.0 &amp; GLSL</text>
      <text x="84" y="74" text-anchor="middle" class="b-sub">3D Spatial &amp; Compute</text>
      <text x="84" y="88" text-anchor="middle" class="b-tier tier-glow" fill="#C084FC">★ OBSIDIAN TIER ★</text>
    </g>
  </g>

  <!-- Badge 4: 50+ Deployments -->
  <g transform="translate(544, 8)">
    <g class="badge-anim f4">
      <polygon points="12,0 156,0 168,12 168,88 156,100 12,100 0,88 0,12" fill="url(#cardGradDark)" stroke="url(#emeraldTier)" stroke-width="1.2" />
      <line x1="0" y1="12" x2="12" y2="0" stroke="#6EE7B7" class="corner-tick" />
      <line x1="156" y1="100" x2="168" y2="88" stroke="#6EE7B7" class="corner-tick" />
      <g>
        <circle cx="84" cy="28" r="17" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" stroke-width="1" stroke-dasharray="4, 4">
          <animateTransform attributeName="transform" type="rotate" from="0 84 28" to="360 84 28" dur="6s" repeatCount="indefinite" />
        </circle>
      </g>
      <text x="84" y="34" text-anchor="middle" font-size="16">🚀</text>
      <text x="84" y="60" text-anchor="middle" class="b-title">50+ DEPLOYMENTS</text>
      <text x="84" y="74" text-anchor="middle" class="b-sub">High-Availability Cloud</text>
      <text x="84" y="88" text-anchor="middle" class="b-tier tier-glow" fill="#34D399">★ DIAMOND TIER ★</text>
    </g>
  </g>

  <!-- Badge 5: OS Kernel Tuner -->
  <g transform="translate(722, 8)">
    <g class="badge-anim f5">
      <polygon points="12,0 156,0 168,12 168,88 156,100 12,100 0,88 0,12" fill="url(#cardGradDark)" stroke="url(#blueTier)" stroke-width="1.2" />
      <line x1="0" y1="12" x2="12" y2="0" stroke="#7DD3FC" class="corner-tick" />
      <line x1="156" y1="100" x2="168" y2="88" stroke="#7DD3FC" class="corner-tick" />
      <g>
        <circle cx="84" cy="28" r="17" fill="rgba(2, 132, 199, 0.12)" stroke="#0284C7" stroke-width="1" stroke-dasharray="4, 4">
          <animateTransform attributeName="transform" type="rotate" from="0 84 28" to="360 84 28" dur="6s" repeatCount="indefinite" />
        </circle>
      </g>
      <text x="84" y="34" text-anchor="middle" font-size="16">⚡</text>
      <text x="84" y="60" text-anchor="middle" class="b-title">OS KERNEL TUNER</text>
      <text x="84" y="74" text-anchor="middle" class="b-sub">Low-Latency Engineering</text>
      <text x="84" y="88" text-anchor="middle" class="b-tier tier-glow" fill="#38BDF8">★ PLATINUM TIER ★</text>
    </g>
  </g>
</svg>
<svg width="900" height="150" viewBox="0 0 900 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="waveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131E" />
      <stop offset="100%" stop-color="#06090F" />
    </linearGradient>

    <linearGradient id="waveBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7701D0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Area Fill Under Spline Wave -->
    <linearGradient id="waveAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#7701D0" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Line Stroke Gradient -->
    <linearGradient id="waveStrokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" />
      <stop offset="50%" stop-color="#007CF0" />
      <stop offset="75%" stop-color="#7701D0" />
      <stop offset="100%" stop-color="#00DFD8" />
    </linearGradient>

    <style>
      .w-title { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 11px; font-weight: 700; fill: #00DFD8; letter-spacing: 2px; }
      .w-meta { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 9.5px; fill: #8B949E; }
      .w-stat { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 10px; font-weight: 700; fill: #FFFFFF; }
      .grid-line { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
      
      .node-pulse {
        animation: pulseNode 2s ease-in-out infinite alternate;
      }
      .node-ripple {
        animation: rippleOut 2.5s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      .badge-glow {
        animation: badgeShimmer 3s ease-in-out infinite alternate;
      }

      @keyframes pulseNode {
        0% { r: 3.5; opacity: 0.7; }
        100% { r: 6; opacity: 1; filter: drop-shadow(0 0 8px #00DFD8); }
      }

      @keyframes rippleOut {
        0% { r: 4; opacity: 0.8; stroke-width: 1.5; }
        100% { r: 16; opacity: 0; stroke-width: 0.5; }
      }

      @keyframes badgeShimmer {
        0% { transform: translateY(0px); filter: drop-shadow(0 0 2px rgba(0, 223, 216, 0.3)); }
        100% { transform: translateY(-2px); filter: drop-shadow(0 0 8px rgba(0, 223, 216, 0.8)); }
      }
    </style>
  </defs>

  <!-- Card Frame with Chamfers -->
  <polygon points="14,2 886,2 898,14 898,136 886,148 14,148 2,136 2,14" fill="url(#waveBg)" stroke="url(#waveBorder)" stroke-width="1.3" />

  <!-- Top Title Ribbon -->
  <g transform="translate(24, 18)">
    <circle cx="6" cy="6" r="3.5" fill="#10B981" />
    <text x="18" y="9.5" class="w-title">CONTRIBUTION ACTIVITY &amp; COMMIT VELOCITY WAVE</text>
    <text x="850" y="9.5" text-anchor="end" class="w-title" fill="#7701D0">968+ ALL-TIME COMMITS</text>
    <line x1="0" y1="18" x2="850" y2="18" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  </g>

  <!-- Horizontal Grid Lines -->
  <line x1="24" y1="60" x2="876" y2="60" class="grid-line" />
  <line x1="24" y1="85" x2="876" y2="85" class="grid-line" />
  <line x1="24" y1="110" x2="876" y2="110" class="grid-line" />

  <!-- Spline Wave Area Fill -->
  <path d="M 24 130 L 24 105 C 80 110, 140 85, 200 95 C 260 105, 320 60, 380 50 C 440 40, 500 75, 560 65 C 620 55, 680 35, 740 45 C 800 55, 840 40, 876 35 L 876 130 Z" fill="url(#waveAreaGrad)" />

  <!-- Spline Wave Stroke Line -->
  <path d="M 24 105 C 80 110, 140 85, 200 95 C 260 105, 320 60, 380 50 C 440 40, 500 75, 560 65 C 620 55, 680 35, 740 45 C 800 55, 840 40, 876 35" fill="none" stroke="url(#waveStrokeGrad)" stroke-width="2.5" />

  <!-- Key Activity Milestone Data Nodes with Ripple Rings -->
  <circle cx="200" cy="95" r="4" fill="#00DFD8" />

  <!-- Milestone 1 -->
  <circle cx="380" cy="50" r="4.5" fill="none" stroke="#007CF0" class="node-ripple" />
  <circle cx="380" cy="50" r="4.5" fill="#007CF0" class="node-pulse" />

  <circle cx="560" cy="65" r="4" fill="#7701D0" />

  <!-- Milestone 2 -->
  <circle cx="740" cy="45" r="5" fill="none" stroke="#00DFD8" class="node-ripple" />
  <circle cx="740" cy="45" r="5" fill="#00DFD8" class="node-pulse" />

  <!-- Milestone 3 -->
  <circle cx="876" cy="35" r="5" fill="none" stroke="#10B981" class="node-ripple" />
  <circle cx="876" cy="35" r="5" fill="#10B981" class="node-pulse" />

  <!-- Peak Velocity Callout Badges with Shimmer -->
  <g transform="translate(380, 26)" class="badge-glow">
    <rect x="-42" y="0" width="84" height="18" rx="9" fill="#0D1117" stroke="#007CF0" stroke-width="1" />
    <text x="0" y="12" text-anchor="middle" class="w-meta" fill="#00DFD8">MA-Opt v11</text>
  </g>

  <g transform="translate(740, 20)" class="badge-glow">
    <rect x="-45" y="0" width="90" height="18" rx="9" fill="#0D1117" stroke="#00DFD8" stroke-width="1" />
    <text x="0" y="12" text-anchor="middle" class="w-meta" fill="#34D399">PEAK VELOCITY</text>
  </g>

  <!-- Bottom Time Axis Labels -->
  <text x="24" y="140" class="w-meta">OCT 2022</text>
  <text x="230" y="140" class="w-meta">2023 // SYSTEMS</text>
  <text x="500" y="140" class="w-meta">2024 // WEBGL &amp; AI</text>
  <text x="730" y="140" class="w-meta">2025 // SIVION</text>
  <text x="876" y="140" text-anchor="end" class="w-meta" fill="#00DFD8">PRESENT (2026)</text>
</svg>
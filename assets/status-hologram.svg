<svg width="900" height="130" viewBox="0 0 900 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="holoBgSupreme" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131E" />
      <stop offset="100%" stop-color="#06090F" />
    </linearGradient>

    <linearGradient id="holoBorderSupreme" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7701D0" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Scanning Holographic Beam -->
    <linearGradient id="scanBeamHolo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0" />
      <stop offset="50%" stop-color="#00DFD8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0" />
    </linearGradient>

    <style>
      .h-title { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #00DFD8; letter-spacing: 1.5px; }
      .h-stat { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 11px; font-weight: 700; fill: #FFFFFF; }
      .h-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 8.5px; fill: #8B949E; }
      .h-val { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 8px; font-weight: 700; letter-spacing: 0.5px; }
      
      .scan-beam {
        animation: scanMove 4s ease-in-out infinite alternate;
      }
      .beacon-dot {
        animation: pulseBeacon 1.8s infinite alternate;
      }
      .bus-flow {
        stroke-dasharray: 4, 4;
        animation: busFlow 1.2s linear infinite;
      }

      @keyframes scanMove {
        0% { transform: translateY(-50px); }
        100% { transform: translateY(85px); }
      }
      @keyframes pulseBeacon {
        0% { opacity: 0.4; transform: scale(0.9); }
        100% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 6px #00DFD8); }
      }
      @keyframes busFlow {
        from { stroke-dashoffset: 8; }
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Frame with Chamfered Corners -->
  <polygon points="16,2 884,2 898,16 898,114 884,128 16,128 2,114 2,16" fill="url(#holoBgSupreme)" stroke="url(#holoBorderSupreme)" stroke-width="1.3" />

  <!-- Radiating Circuit Bus Lines Behind Cards -->
  <line x1="225" y1="80" x2="245" y2="80" stroke="rgba(0, 223, 216, 0.6)" stroke-width="1.5" class="bus-flow" />
  <line x1="445" y1="80" x2="465" y2="80" stroke="rgba(119, 1, 208, 0.6)" stroke-width="1.5" class="bus-flow" />
  <line x1="665" y1="80" x2="685" y2="80" stroke="rgba(16, 185, 129, 0.6)" stroke-width="1.5" class="bus-flow" />

  <!-- Scanning Holographic Beam -->
  <g class="scan-beam">
    <rect x="2" y="10" width="896" height="45" fill="url(#scanBeamHolo)" pointer-events="none" />
  </g>

  <!-- Top Status Ribbon -->
  <g transform="translate(24, 18)">
    <circle cx="6" cy="6" r="4" fill="#00DFD8" class="beacon-dot" />
    <text x="18" y="9.5" class="h-title">HOLOGRAPHIC TELEMETRY CHIP // CORE SYSTEM METRICS</text>
    <text x="850" y="9.5" text-anchor="end" class="h-title" fill="#7701D0">SYS-ARCH-v2.8 [ONLINE]</text>
    <line x1="0" y1="18" x2="850" y2="18" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  </g>

  <!-- Metric Pod 1: AI Cognition -->
  <g transform="translate(24, 46)">
    <polygon points="8,0 196,0 204,8 204,62 196,70 8,70 0,62 0,8" fill="rgba(0, 223, 216, 0.05)" stroke="rgba(0, 223, 216, 0.35)" stroke-width="1.2" />
    <text x="14" y="20" font-size="14">🧠</text>
    <text x="36" y="20" class="h-stat">AI COGNITION</text>
    <text x="14" y="38" class="h-sub">SIVION Multi-Agent Core</text>
    <text x="14" y="52" class="h-val" fill="#00DFD8">4/4 THREADS ACTIVE</text>
    <rect x="14" y="58" width="176" height="3" rx="1.5" fill="rgba(255, 255, 255, 0.06)" />
    <rect x="14" y="58" width="168" height="3" rx="1.5" fill="#00DFD8" />
  </g>

  <!-- Metric Pod 2: Kernel Latency -->
  <g transform="translate(244, 46)">
    <polygon points="8,0 196,0 204,8 204,62 196,70 8,70 0,62 0,8" fill="rgba(119, 1, 208, 0.05)" stroke="rgba(119, 1, 208, 0.35)" stroke-width="1.2" />
    <text x="14" y="20" font-size="14">⚡</text>
    <text x="36" y="20" class="h-stat">KERNEL LATENCY</text>
    <text x="14" y="38" class="h-sub">MA-Optimizer Engine</text>
    <text x="14" y="52" class="h-val" fill="#A855F7">0.42ms DISPATCH</text>
    <rect x="14" y="58" width="176" height="3" rx="1.5" fill="rgba(255, 255, 255, 0.06)" />
    <rect x="14" y="58" width="172" height="3" rx="1.5" fill="#A855F7" />
  </g>

  <!-- Metric Pod 3: WebGL Shaders -->
  <g transform="translate(464, 46)">
    <polygon points="8,0 196,0 204,8 204,62 196,70 8,70 0,62 0,8" fill="rgba(16, 185, 129, 0.05)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.2" />
    <text x="14" y="20" font-size="14">🎮</text>
    <text x="36" y="20" class="h-stat">WEBGL SHADERS</text>
    <text x="14" y="38" class="h-sub">Three.js &amp; GPGPU Shaders</text>
    <text x="14" y="52" class="h-val" fill="#10B981">&gt;144 FPS @ 4K COMPUTE</text>
    <rect x="14" y="58" width="176" height="3" rx="1.5" fill="rgba(255, 255, 255, 0.06)" />
    <rect x="14" y="58" width="165" height="3" rx="1.5" fill="#10B981" />
  </g>

  <!-- Metric Pod 4: Cloud Resilience -->
  <g transform="translate(684, 46)">
    <polygon points="8,0 184,0 192,8 192,62 184,70 8,70 0,62 0,8" fill="rgba(2, 132, 199, 0.05)" stroke="rgba(2, 132, 199, 0.35)" stroke-width="1.2" />
    <text x="14" y="20" font-size="14">☁️</text>
    <text x="36" y="20" class="h-stat">CLOUD RESILIENCY</text>
    <text x="14" y="38" class="h-sub">FastAPI + Supabase Sync</text>
    <text x="14" y="52" class="h-val" fill="#0284C7">99.99% UPTIME CLUSTER</text>
    <rect x="14" y="58" width="164" height="3" rx="1.5" fill="rgba(255, 255, 255, 0.06)" />
    <rect x="14" y="58" width="162" height="3" rx="1.5" fill="#0284C7" />
  </g>
</svg>
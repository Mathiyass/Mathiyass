<svg width="900" height="120" viewBox="0 0 900 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="holoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F141F" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>

    <linearGradient id="holoBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7701D0" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="scanbeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0" />
      <stop offset="50%" stop-color="#00DFD8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0" />
    </linearGradient>

    <style>
      .h-title { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #00DFD8; letter-spacing: 1.5px; }
      .h-stat { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 12px; font-weight: 700; fill: #FFFFFF; }
      .h-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.5px; fill: #8B949E; }
      .h-val { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 9px; font-weight: 700; }
      
      .scan-sweep {
        animation: scanMove 4s ease-in-out infinite;
      }
      .beacon-dot {
        animation: pulseDot 1.8s infinite alternate;
      }

      @keyframes scanMove {
        0%, 100% { transform: translateY(-120px); }
        50% { transform: translateY(120px); }
      }
      @keyframes pulseDot {
        0% { opacity: 0.4; transform: scale(0.9); }
        100% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 6px #00DFD8); }
      }
    </style>
  </defs>

  <!-- Holographic Card Frame -->
  <rect x="1" y="1" width="898" height="118" rx="10" fill="url(#holoBg)" stroke="url(#holoBorder)" stroke-width="1.2" />

  <!-- Scanning Holographic Light Sweep -->
  <g class="scan-sweep">
    <rect x="2" y="10" width="896" height="40" fill="url(#scanbeam)" pointer-events="none" />
  </g>

  <!-- Top Status Ribbon -->
  <g transform="translate(20, 18)">
    <circle cx="6" cy="6" r="3.5" fill="#10B981" class="beacon-dot" />
    <text x="18" y="9.5" class="h-title">HOLOGRAPHIC TELEMETRY CHIP // CORE SYSTEM METRICS</text>
    <text x="860" y="9.5" text-anchor="end" class="h-title" fill="#7701D0">SYS-ARCH-v2.6 [ONLINE]</text>
    <line x1="0" y1="18" x2="860" y2="18" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  </g>

  <!-- 4 Telemetry Modules -->
  <!-- Module 1: AI Agents -->
  <g transform="translate(25, 48)">
    <rect width="200" height="56" rx="6" fill="#141922" stroke="rgba(0, 223, 216, 0.3)" stroke-width="1" />
    <text x="12" y="18" class="h-stat">🤖 AI COGNITION</text>
    <text x="12" y="34" class="h-sub">SIVION Multi-Agent Core</text>
    <text x="12" y="47" class="h-val" fill="#00DFD8">● 6/6 THREADS ACTIVE</text>
  </g>

  <!-- Module 2: Kernel Latency -->
  <g transform="translate(245, 48)">
    <rect width="200" height="56" rx="6" fill="#141922" stroke="rgba(119, 1, 208, 0.3)" stroke-width="1" />
    <text x="12" y="18" class="h-stat">⚡ KERNEL LATENCY</text>
    <text x="12" y="34" class="h-sub">MA-Optimizer OS Tuner</text>
    <text x="12" y="47" class="h-val" fill="#C4B5FD">● 0.42ms [ZERO JITTER]</text>
  </g>

  <!-- Module 3: WebGL Compute -->
  <g transform="translate(465, 48)">
    <rect width="200" height="56" rx="6" fill="#141922" stroke="rgba(0, 223, 216, 0.3)" stroke-width="1" />
    <text x="12" y="18" class="h-stat">🎮 WEBGL SHADERS</text>
    <text x="12" y="34" class="h-sub">Three.js &amp; GPGPU Shaders</text>
    <text x="12" y="47" class="h-val" fill="#00DFD8">● 144 FPS @ 4K COMPUTE</text>
  </g>

  <!-- Module 4: Cloud Sync -->
  <g transform="translate(685, 48)">
    <rect width="190" height="56" rx="6" fill="#141922" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <text x="12" y="18" class="h-stat">☁️ CLOUD RESILIENCY</text>
    <text x="12" y="34" class="h-sub">FastAPI + Supabase Sync</text>
    <text x="12" y="47" class="h-val" fill="#10B981">● 99.99% FAULT TOLERANT</text>
  </g>
</svg>
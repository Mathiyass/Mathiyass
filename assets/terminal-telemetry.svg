  <defs>
    <!-- 3D Glass Chassis Gradient -->
    <linearGradient id="termGlassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111726" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#0E1422" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#06090E" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Top Specular Edge -->
    <linearGradient id="termSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#00DFD8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </linearGradient>

    <!-- Chrome Border Gradient -->
    <linearGradient id="termChromeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.95"/>
    </linearGradient>

    <style>
      .term-header { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 10px; fill: #8B949E; }
      .term-cmd { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 700; fill: #00DFD8; }
      .term-log { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 9px; fill: #C9D1D9; }
      .term-accent-purple { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #C084FC; }
      .term-accent-emerald { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #34D399; }
      .term-accent-cyan { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #00DFD8; }
      
      .cursor-blink { animation: termCursorBlink 0.8s step-end infinite; }
      .mem-pulse { animation: memPulse 2.5s ease-in-out infinite alternate; }
      .cpu-ping { animation: cpuPing 1.8s infinite alternate; }

      @keyframes termCursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes memPulse {
        0% { width: 140px; }
        100% { width: 185px; }
      }
      @keyframes cpuPing {
        0% { opacity: 0.4; }
        100% { opacity: 1; filter: drop-shadow(0 0 6px #10B981); }
      }
    

/* EXTREME HYPER ANIMATIONS (SAFE) */
@keyframes neon-flicker {
  0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; filter: drop-shadow(0 0 8px rgba(0,223,216,0.8)) drop-shadow(0 0 15px rgba(0,223,216,0.6)); }
  20%, 24%, 55% { opacity: 0.4; filter: none; }
}
@keyframes cyber-scan {
  0% { transform: translateY(-100%); opacity: 0; }
  10% { opacity: 0.8; }
  90% { opacity: 0.8; }
  100% { transform: translateY(1000%); opacity: 0; }
}
@keyframes pulse-glow {
  0%, 100% { filter: drop-shadow(0 0 5px rgba(168,85,247,0.5)) drop-shadow(0 0 20px rgba(168,85,247,0.3)); }
  50% { filter: drop-shadow(0 0 15px rgba(0,223,216,0.9)) drop-shadow(0 0 30px rgba(0,223,216,0.6)); }
}
@keyframes particle-drift {
  0% { transform: translate(0, 0); opacity: 0; }
  10% { opacity: 0.8; }
  90% { opacity: 0.8; }
  100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
}
@keyframes dash-flow {
  to { stroke-dashoffset: -100; }
}
@keyframes rgb-shift {
  0% { fill: #00DFD8; }
  33% { fill: #A855F7; }
  66% { fill: #FF007F; }
  100% { fill: #00DFD8; }
}
@keyframes border-run {
  0% { stroke-dashoffset: 1000; }
  100% { stroke-dashoffset: 0; }
}

.neon-text { animation: neon-flicker 4s infinite alternate; }
.cyber-scanner { animation: cyber-scan 3s cubic-bezier(0.1, 0.8, 0.9, 0.2) infinite; }
.hyper-glow { animation: pulse-glow 2s ease-in-out infinite; }
.dash-flow { stroke-dasharray: 10, 5; animation: dash-flow 2s linear infinite; }
.rgb-text { animation: rgb-shift 6s linear infinite; }
.border-run { stroke-dasharray: 100 200; animation: border-run 5s linear infinite; }
</style>

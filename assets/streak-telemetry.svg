<svg width="900" height="110" viewBox="0 0 900 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 3D Glass Chassis Gradient -->
    <linearGradient id="stkGlassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111726" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0E1422" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#06090E" stop-opacity="0.98" />
    </linearGradient>

    <!-- Top Specular Edge -->
    <linearGradient id="stkSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#00DFD8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </linearGradient>

    <!-- Chrome Border Gradient -->
    <linearGradient id="stkChromeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.95" />
    </linearGradient>

    <style>
      .stk-title { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #8B949E; letter-spacing: 1.2px; text-anchor: middle; }
      .stk-num { font-family: 'Arial Black', Impact, sans-serif; font-size: 32px; font-weight: 900; fill: #FFFFFF; text-anchor: middle; }
      .stk-sub { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 8px; fill: #6E7681; text-anchor: middle; }
      
      .sonar-wave {
        animation: sonarExpand 2.5s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
      }
      .flame-pulse {
        animation: flameBounce 1.5s ease-in-out infinite alternate;
      }
      .card-float {
        animation: cardLevitate 3.5s ease-in-out infinite alternate;
      }

      @keyframes sonarExpand {
        0% { r: 12; opacity: 0.9; stroke-width: 1.5; }
        100% { r: 38; opacity: 0; stroke-width: 0.3; }
      }
      @keyframes flameBounce {
        0% { transform: scale(0.9); filter: drop-shadow(0 0 4px #00DFD8); }
        100% { transform: scale(1.15); filter: drop-shadow(0 0 16px #00DFD8); }
      }
      @keyframes cardLevitate {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-3px); }
      }
    </style>
  </defs>

  <!-- 3 3D Chamfered Glass Streak Pods -->

  <!-- Card 1: Total Contributions -->
  <g transform="translate(10, 6)" class="card-float">
    <polygon points="12,0 274,0 282,8 282,90 274,98 12,98 0,90 0,8" fill="url(#stkGlassBg)" stroke="rgba(0, 124, 240, 0.5)" stroke-width="1.2" />
    <path d="M 12 1 L 274 1 L 281 7 L 1 7 Z" fill="url(#stkSpecular)" />
    <!-- Rotating Gyroscope Behind Number -->
    <g transform="translate(141, 48)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#007CF0" class="sonar-wave" />
      <ellipse cx="0" cy="0" rx="36" ry="18" fill="none" stroke="rgba(0, 124, 240, 0.25)" stroke-width="1" stroke-dasharray="4, 4">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite" />
      </ellipse>
    </g>
    <text x="141" y="24" class="stk-title" fill="#38BDF8">TOTAL CONTRIBUTIONS</text>
    <text x="141" y="62" class="stk-num">968<tspan fill="#00DFD8" font-size="22">+</tspan></text>
    <text x="141" y="82" class="stk-sub">OCT 18, 2022 – PRESENT</text>
  </g>

  <!-- Card 2: Current Streak -->
  <g transform="translate(308, 6)" class="card-float" style="animation-delay: 0.4s;">
    <polygon points="12,0 274,0 282,8 282,90 274,98 12,98 0,90 0,8" fill="url(#stkGlassBg)" stroke="rgba(0, 223, 216, 0.6)" stroke-width="1.3" />
    <path d="M 12 1 L 274 1 L 281 7 L 1 7 Z" fill="url(#stkSpecular)" />
    <!-- 3D Tilted Gyro Orbit -->
    <g transform="translate(141, 48)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#00DFD8" class="sonar-wave" style="animation-delay: -1.25s;" />
      <ellipse cx="0" cy="0" rx="36" ry="18" fill="none" stroke="rgba(0, 223, 216, 0.35)" stroke-width="1.2" stroke-dasharray="4, 4">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite" />
      </ellipse>
      <circle cx="0" cy="-18" r="2.5" fill="#FFFFFF" filter="drop-shadow(0 0 4px #00DFD8)">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3s" repeatCount="indefinite" />
      </circle>
    </g>
    <text x="141" y="24" class="stk-title" fill="#00DFD8">CURRENT STREAK</text>
    <text x="141" y="62" class="stk-num" fill="#00DFD8">100<tspan font-size="20">%</tspan></text>
    <text x="141" y="82" class="stk-sub" fill="#34D399">ACTIVE DAILY SPRINT 🔥</text>
  </g>

  <!-- Card 3: Longest Streak -->
  <g transform="translate(606, 6)" class="card-float" style="animation-delay: 0.8s;">
    <polygon points="12,0 274,0 282,8 282,90 274,98 12,98 0,90 0,8" fill="url(#stkGlassBg)" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1.2" />
    <path d="M 12 1 L 274 1 L 281 7 L 1 7 Z" fill="url(#stkSpecular)" />
    <g transform="translate(141, 48)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#A855F7" class="sonar-wave" style="animation-delay: -0.6s;" />
      <ellipse cx="0" cy="0" rx="36" ry="18" fill="none" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1" stroke-dasharray="4, 4">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="8s" repeatCount="indefinite" />
      </ellipse>
    </g>
    <text x="141" y="24" class="stk-title" fill="#C084FC">LONGEST STREAK</text>
    <text x="141" y="62" class="stk-num">PEAK</text>
    <text x="141" y="82" class="stk-sub">MAXIMUM ENGAGEMENT ⚡</text>
  </g>
</svg>
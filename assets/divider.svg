<svg width="900" height="44" viewBox="0 0 900 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Volumetric Core Glow -->
    <radialGradient id="gyroCoreAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="25%" stop-color="#00DFD8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#7701D0" stop-opacity="0.5" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Rail Top Surface Gradient (Specular) -->
    <linearGradient id="rail3DTopLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0" />
      <stop offset="50%" stop-color="#00DFD8" stop-opacity="0.3" />
      <stop offset="85%" stop-color="#E0F7FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="rail3DTopRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="15%" stop-color="#F3E8FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7701D0" stop-opacity="0" />
    </linearGradient>

    <!-- 3D Rail Front Bevel Gradient (Shadow) -->
    <linearGradient id="rail3DFrontLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004D40" stop-opacity="0" />
      <stop offset="60%" stop-color="#00838F" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="rail3DFrontRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#4A148C" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#311B92" stop-opacity="0" />
    </linearGradient>

    <style>
      .energy-pulse-left {
        stroke-dasharray: 8, 16;
        animation: energySurgeLeft 0.7s linear infinite;
      }
      .energy-pulse-right {
        stroke-dasharray: 8, 16;
        animation: energySurgeRight 0.7s linear infinite;
      }
      
      .c1 { animation-delay: 0s; }
      .c2 { animation-delay: 0.15s; }
      .c3 { animation-delay: 0.3s; }
      .c4 { animation-delay: 0.45s; }

      
      

      @keyframes energySurgeLeft {
        from { stroke-dashoffset: 48; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes energySurgeRight {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 48; }
      }
      
      
      
    
      @keyframes dashFlow {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes dashFlowRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 40; }
      }
      .dash-flow {
        stroke-dasharray: 8, 6;
        animation: dashFlow 2s linear infinite;
      }
      .dash-flow-rev {
        stroke-dasharray: 8, 6;
        animation: dashFlowRev 2s linear infinite;
      }
    </style>
  </defs>

  <!-- ==================== 3D EXTRUDED DUAL-RAIL CHASSIS ==================== -->

  <!-- Left Lower Bevel Face (3D Depth Shadow) -->
  <polygon points="10,23 410,23 410,26 10,26" fill="url(#rail3DFrontLeft)" />
  <!-- Left Upper Bevel Face (3D Top Specular) -->
  <polygon points="10,21 410,21 410,23 10,23" fill="url(#rail3DTopLeft)" />
  
  <!-- Left Upper Kinetic Stream -->
  <line x1="60" y1="14" x2="400" y2="14" stroke="#00DFD8" stroke-opacity="0.35" stroke-width="1.2" class="energy-pulse-left" />
  <!-- Left Main Laser Core Beam -->
  <line x1="10" y1="22" x2="410" y2="22" stroke="url(#rail3DTopLeft)" stroke-width="2.2" />
  <!-- Left Lower Kinetic Stream -->
  <line x1="120" y1="30" x2="400" y2="30" stroke="#67E8F9" stroke-opacity="0.25" stroke-width="1.2" class="energy-pulse-left" />

  <!-- Left 3D Support Truss Struts -->
  <line x1="180" y1="14" x2="190" y2="30" stroke="rgba(0, 223, 216, 0.3)" stroke-width="1" />
  <line x1="240" y1="14" x2="250" y2="30" stroke="rgba(0, 223, 216, 0.3)" stroke-width="1" />
  <line x1="300" y1="14" x2="310" y2="30" stroke="rgba(0, 223, 216, 0.4)" stroke-width="1" />
  <line x1="360" y1="14" x2="370" y2="30" stroke="rgba(0, 223, 216, 0.5)" stroke-width="1" />

  <!-- Left High-Energy Inward Chevrons -->
  <g transform="translate(0, 0)">
    <path d="M 345 15 L 352 22 L 345 29" fill="none" stroke="#00DFD8" stroke-width="1.5" class="chevron-surge c1" />
    <path d="M 360 15 L 367 22 L 360 29" fill="none" stroke="#00DFD8" stroke-width="1.5" class="chevron-surge c2" />
    <path d="M 375 15 L 382 22 L 375 29" fill="none" stroke="#67E8F9" stroke-width="1.6" class="chevron-surge c3" />
    <path d="M 390 14 L 398 22 L 390 30" fill="none" stroke="#FFFFFF" stroke-width="1.8" class="chevron-surge c4" />
  </g>

  <!-- Right Lower Bevel Face (3D Depth Shadow) -->
  <polygon points="490,23 890,23 890,26 490,26" fill="url(#rail3DFrontRight)" />
  <!-- Right Upper Bevel Face (3D Top Specular) -->
  <polygon points="490,21 890,21 890,23 490,23" fill="url(#rail3DTopRight)" />

  <!-- Right Upper Kinetic Stream -->
  <line x1="500" y1="14" x2="840" y2="14" stroke="#7701D0" stroke-opacity="0.35" stroke-width="1.2" class="energy-pulse-right" />
  <!-- Right Main Laser Core Beam -->
  <line x1="490" y1="22" x2="890" y2="22" stroke="url(#rail3DTopRight)" stroke-width="2.2" />
  <!-- Right Lower Kinetic Stream -->
  <line x1="500" y1="30" x2="780" y2="30" stroke="#A855F7" stroke-opacity="0.25" stroke-width="1.2" class="energy-pulse-right" />

  <!-- Right 3D Support Truss Struts -->
  <line x1="540" y1="14" x2="530" y2="30" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1" />
  <line x1="600" y1="14" x2="590" y2="30" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
  <line x1="660" y1="14" x2="650" y2="30" stroke="rgba(119, 1, 208, 0.3)" stroke-width="1" />
  <line x1="720" y1="14" x2="710" y2="30" stroke="rgba(119, 1, 208, 0.3)" stroke-width="1" />

  <!-- Right High-Energy Inward Chevrons -->
  <g transform="translate(0, 0)">
    <path d="M 555 15 L 548 22 L 555 29" fill="none" stroke="#A855F7" stroke-width="1.5" class="chevron-surge c1" />
    <path d="M 540 15 L 533 22 L 540 29" fill="none" stroke="#A855F7" stroke-width="1.5" class="chevron-surge c2" />
    <path d="M 525 15 L 518 22 L 525 29" fill="none" stroke="#E879F9" stroke-width="1.6" class="chevron-surge c3" />
    <path d="M 510 14 L 502 22 L 510 30" fill="none" stroke="#FFFFFF" stroke-width="1.8" class="chevron-surge c4" />
  </g>

  <!-- ==================== CENTER: 3D HOLOGRAPHIC GYROSCOPE CORE ==================== -->

  <!-- Expanding Shockwave Rings in 3D Perspective -->
  <circle cx="450" cy="22" r="8" fill="none" stroke="#00DFD8" class="shockwave-3d" />
  <circle cx="450" cy="22" r="8" fill="none" stroke="#A855F7" class="shockwave-3d" style="animation-delay: -1.1s;" />

  <!-- Outer 3D Gyroscope Glass Ring (Tilted 3D Orbit - 10s SMIL Rotation) -->
  <g>
    <ellipse cx="450" cy="22" rx="28" ry="14" fill="none" stroke="rgba(0, 223, 216, 0.6)" stroke-width="1.4" stroke-dasharray="8, 6" />
    <animateTransform attributeName="transform" type="rotate" from="0 450 22" to="360 450 22" dur="10s" repeatCount="indefinite" />
  </g>

  <!-- Mid 3D Gyroscope Bezel Ring (Reverse Tilted Orbit - 6s SMIL Rotation) -->
  <g>
    <ellipse cx="450" cy="22" rx="20" ry="10" fill="rgba(15, 23, 42, 0.85)" stroke="#A855F7" stroke-width="1.3" />
    <animateTransform attributeName="transform" type="rotate" from="360 450 22" to="0 450 22" dur="6s" repeatCount="indefinite" />
  </g>

  <!-- Inner 3D Hexagonal Aperture (Fast 3s SMIL Rotation) -->
  <g>
    <polygon points="450,13 458,18 458,26 450,31 442,26 442,18" fill="rgba(119, 1, 208, 0.3)" stroke="#00DFD8" stroke-width="1.2" />
    <animateTransform attributeName="transform" type="rotate" from="0 450 22" to="360 450 22" dur="3s" repeatCount="indefinite" />
  </g>

  <!-- Orbiting Photon Satellite Node along 3D Ring -->
  <g>
    <circle cx="450" cy="8" r="2.2" fill="#FFFFFF" filter="drop-shadow(0 0 6px #00DFD8)" />
    <animateTransform attributeName="transform" type="rotate" from="0 450 22" to="360 450 22" dur="2.5s" repeatCount="indefinite" />
  </g>
  <g>
    <circle cx="450" cy="36" r="2.2" fill="#E879F9" filter="drop-shadow(0 0 6px #A855F7)" />
    <animateTransform attributeName="transform" type="rotate" from="360 450 22" to="0 450 22" dur="2.5s" repeatCount="indefinite" />
  </g>

  <!-- Central 3D Volumetric Plasma Core -->
  <circle cx="450" cy="22" r="5" fill="url(#gyroCoreAura)" class="core-heart" />
  <circle cx="450" cy="22" r="2" fill="#FFFFFF" />
</svg>
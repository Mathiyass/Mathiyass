<svg width="900" height="72" viewBox="0 0 900 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 3D Glass Chassis Gradient -->
    <linearGradient id="hubGlassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111726" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0E1422" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#06090E" stop-opacity="0.98" />
    </linearGradient>

    <!-- Top Specular Edge -->
    <linearGradient id="hubSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#00DFD8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </linearGradient>

    <style>
      .hub-btn-text {
        font-family: 'Fira Code', 'SF Mono', Consolas, monospace;
        font-size: 9.5px;
        font-weight: 700;
        fill: #FFFFFF;
        letter-spacing: 1px;
      }
      .hub-hover {
        animation: btnFloat 3s ease-in-out infinite alternate;
      }
      .h1 { animation-delay: 0s; }
      .h2 { animation-delay: 0.25s; }
      .h3 { animation-delay: 0.5s; }
      .h4 { animation-delay: 0.75s; }
      .h5 { animation-delay: 1.0s; }
      .h6 { animation-delay: 1.25s; }

      @keyframes btnFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-3px); }
      }
    </style>
  </defs>

  <!-- 6 3D Glass Connected Hub Portals -->

  <!-- Portal 1: Portfolio -->
  <a href="https://mathiya.cc" target="_blank">
    <g transform="translate(10, 8)" class="hub-hover h1">
      <polygon points="8,0 134,0 142,8 142,48 134,56 8,56 0,48 0,8" fill="url(#hubGlassBg)" stroke="#00DFD8" stroke-width="1.3" />
      <path d="M 8 1 L 134 1 L 141 7 L 1 7 Z" fill="url(#hubSpecular)" />
      <circle cx="20" cy="28" r="4" fill="#00DFD8" />
      <circle cx="20" cy="28" r="8" fill="none" stroke="#00DFD8" stroke-width="1" stroke-dasharray="2, 2">
        <animateTransform attributeName="transform" type="rotate" from="0 20 28" to="360 20 28" dur="4s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="32" class="hub-btn-text">PORTFOLIO</text>
    </g>
  </a>

  <!-- Portal 2: LinkedIn -->
  <a href="https://linkedin.com/in/mathisha-a-a955941a2/" target="_blank">
    <g transform="translate(158, 8)" class="hub-hover h2">
      <polygon points="8,0 134,0 142,8 142,48 134,56 8,56 0,48 0,8" fill="url(#hubGlassBg)" stroke="#007CF0" stroke-width="1.3" />
      <path d="M 8 1 L 134 1 L 141 7 L 1 7 Z" fill="url(#hubSpecular)" />
      <circle cx="20" cy="28" r="4" fill="#007CF0" />
      <circle cx="20" cy="28" r="8" fill="none" stroke="#007CF0" stroke-width="1" stroke-dasharray="2, 2">
        <animateTransform attributeName="transform" type="rotate" from="360 20 28" to="0 20 28" dur="4s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="32" class="hub-btn-text" fill="#38BDF8">LINKEDIN</text>
    </g>
  </a>

  <!-- Portal 3: Twitter / X -->
  <a href="https://x.com/__Mathiya__" target="_blank">
    <g transform="translate(306, 8)" class="hub-hover h3">
      <polygon points="8,0 134,0 142,8 142,48 134,56 8,56 0,48 0,8" fill="url(#hubGlassBg)" stroke="#E2E8F0" stroke-width="1.3" />
      <path d="M 8 1 L 134 1 L 141 7 L 1 7 Z" fill="url(#hubSpecular)" />
      <circle cx="20" cy="28" r="4" fill="#E2E8F0" />
      <circle cx="20" cy="28" r="8" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2, 2">
        <animateTransform attributeName="transform" type="rotate" from="0 20 28" to="360 20 28" dur="4s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="32" class="hub-btn-text" fill="#FFFFFF">TWITTER / X</text>
    </g>
  </a>

  <!-- Portal 4: Discord -->
  <a href="https://discord.gg/z3k3NVxuqY" target="_blank">
    <g transform="translate(454, 8)" class="hub-hover h4">
      <polygon points="8,0 134,0 142,8 142,48 134,56 8,56 0,48 0,8" fill="url(#hubGlassBg)" stroke="#5865F2" stroke-width="1.3" />
      <path d="M 8 1 L 134 1 L 141 7 L 1 7 Z" fill="url(#hubSpecular)" />
      <circle cx="20" cy="28" r="4" fill="#5865F2" />
      <circle cx="20" cy="28" r="8" fill="none" stroke="#5865F2" stroke-width="1" stroke-dasharray="2, 2">
        <animateTransform attributeName="transform" type="rotate" from="360 20 28" to="0 20 28" dur="4s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="32" class="hub-btn-text" fill="#818CF8">DISCORD</text>
    </g>
  </a>

  <!-- Portal 5: Medium -->
  <a href="https://medium.com/@mathishaangirasa" target="_blank">
    <g transform="translate(602, 8)" class="hub-hover h5">
      <polygon points="8,0 134,0 142,8 142,48 134,56 8,56 0,48 0,8" fill="url(#hubGlassBg)" stroke="#10B981" stroke-width="1.3" />
      <path d="M 8 1 L 134 1 L 141 7 L 1 7 Z" fill="url(#hubSpecular)" />
      <circle cx="20" cy="28" r="4" fill="#10B981" />
      <circle cx="20" cy="28" r="8" fill="none" stroke="#10B981" stroke-width="1" stroke-dasharray="2, 2">
        <animateTransform attributeName="transform" type="rotate" from="0 20 28" to="360 20 28" dur="4s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="32" class="hub-btn-text" fill="#34D399">MEDIUM</text>
    </g>
  </a>

  <!-- Portal 6: YouTube -->
  <a href="https://youtube.com/@mathiya1783" target="_blank">
    <g transform="translate(750, 8)" class="hub-hover h6">
      <polygon points="8,0 134,0 142,8 142,48 134,56 8,56 0,48 0,8" fill="url(#hubGlassBg)" stroke="#EF4444" stroke-width="1.3" />
      <path d="M 8 1 L 134 1 L 141 7 L 1 7 Z" fill="url(#hubSpecular)" />
      <circle cx="20" cy="28" r="4" fill="#EF4444" />
      <circle cx="20" cy="28" r="8" fill="none" stroke="#EF4444" stroke-width="1" stroke-dasharray="2, 2">
        <animateTransform attributeName="transform" type="rotate" from="360 20 28" to="0 20 28" dur="4s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="32" class="hub-btn-text" fill="#F87171">YOUTUBE</text>
    </g>
  </a>
</svg>
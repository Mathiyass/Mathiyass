  <defs>
    <!-- Background Glass Gradient -->
    <linearGradient id="typGlassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0E1422" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#06090E" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Top Specular Highlight -->
    <linearGradient id="typSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#00DFD8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </linearGradient>

    <!-- Chrome Border Gradient -->
    <linearGradient id="typBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Sweeping Laser Scan Gradient -->
    <linearGradient id="typLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#00DFD8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <!-- Clip Paths for Typewriter Reveal -->
    <clipPath id="clip1">
      <rect x="230" y="0" width="0" height="44">
        <animate attributeName="width" values="0; 520; 520; 0; 0; 0; 0; 0; 0; 0; 0; 0" keyTimes="0; 0.08; 0.22; 0.25; 0.26; 0.50; 0.51; 0.75; 0.76; 0.98; 0.99; 1" dur="16s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="clip2">
      <rect x="230" y="0" width="0" height="44">
        <animate attributeName="width" values="0; 0; 0; 520; 520; 0; 0; 0; 0; 0; 0; 0" keyTimes="0; 0.25; 0.26; 0.34; 0.47; 0.50; 0.51; 0.75; 0.76; 0.98; 0.99; 1" dur="16s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="clip3">
      <rect x="230" y="0" width="0" height="44">
        <animate attributeName="width" values="0; 0; 0; 0; 0; 520; 520; 0; 0; 0; 0; 0" keyTimes="0; 0.50; 0.51; 0.52; 0.53; 0.59; 0.72; 0.75; 0.76; 0.98; 0.99; 1" dur="16s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="clip4">
      <rect x="230" y="0" width="0" height="44">
        <animate attributeName="width" values="0; 0; 0; 0; 0; 0; 0; 520; 520; 0; 0; 0" keyTimes="0; 0.75; 0.76; 0.77; 0.78; 0.84; 0.97; 0.99; 0.995; 0.998; 0.999; 1" dur="16s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <style>
.term-prompt { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #00DFD8; letter-spacing: 1px; }
    .type-line { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 12.5px; font-weight: 600; fill: #FFFFFF; }
  

/* CONTINUOUS HIGH-FPS CYBER ANIMATIONS (NO PULSE, NO GLITCH) */
@keyframes cyber-scan {
  0% { transform: translateY(-100%); }
  100% { transform: translateY(1000%); }
}
@keyframes border-run {
  0% { stroke-dashoffset: 1000; }
  100% { stroke-dashoffset: 0; }
}
@keyframes dash-flow {
  0% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: -200; }
}
@keyframes dash-flow-reverse {
  0% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 200; }
}
@keyframes particle-drift {
  0% { transform: translate(0, 0); }
  50% { transform: translate(var(--dx), var(--dy)); }
  100% { transform: translate(0, 0); }
}

.cyber-scanner { 
  animation: cyber-scan 3.5s linear infinite; 
  opacity: 0.45; 
}
.border-run { 
  stroke-dasharray: 100 200; 
  animation: border-run 5s linear infinite; 
}
.dash-flow { 
  stroke-dasharray: 8 6; 
  animation: dash-flow 2.5s linear infinite; 
}
.dash-flow-reverse { 
  stroke-dasharray: 12 8; 
  animation: dash-flow-reverse 3.5s linear infinite; 
}
.hyper-glow { 
  filter: drop-shadow(0 0 4px rgba(0, 223, 216, 0.4)); 
}
.purple-glow { 
  filter: drop-shadow(0 0 4px rgba(168, 85, 247, 0.4)); 
}
</style>
  </defs>

  <!-- 3D Glass Chassis Container -->
  <polygon points="6,2 844,2 848,6 848,38 844,42 6,42 2,38 2,6" fill="url(#typGlassBg)" stroke="url(#typBorder)" stroke-width="1.2"/>
  <path d="M 6 3 L 844 3 L 847 7 L 3 7 Z" fill="url(#typSpecular)" class="dash-flow hyper-glow"/>

  <!-- Sweeping Laser Beam Across Track -->
  <rect x="0" y="2" width="160" height="2" fill="url(#typLaser)">
    <animate attributeName="x" from="-180" to="860" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Traffic Lights Terminal Header -->
  <g transform="translate(18, 22)">
    <circle cx="0" cy="0" r="3.5" fill="#EF4444" opacity="0.85" class="hyper-glow"/>
    <circle cx="12" cy="0" r="3.5" fill="#FBBF24" opacity="0.85" class="hyper-glow"/>
    <circle cx="24" cy="0" r="3.5" fill="#10B981" class="beacon-dot hyper-glow"/>
  <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="2.2s" additive="sum" repeatCount="indefinite"/></g>

  <!-- Terminal Prompt -->
  <g transform="translate(60, 26)">
    <text x="0" y="0" class="term-prompt hyper-glow">SYS://PROMPT ❯</text>
  <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="2.8s" additive="sum" repeatCount="indefinite"/></g>

  <!-- Live Audio Waveform Bars next to Prompt -->
  <g transform="translate(185, 27)">
    <rect x="0" y="-12" width="2" height="12" fill="#00DFD8" class="bar-bounce" style="transform-origin: bottom; animation-delay: 0.1s;"/>
    <rect x="4" y="-12" width="2" height="12" fill="#38BDF8" class="bar-bounce" style="transform-origin: bottom; animation-delay: 0.3s;"/>
    <rect x="8" y="-12" width="2" height="12" fill="#A855F7" class="bar-bounce" style="transform-origin: bottom; animation-delay: 0.5s;"/>
    <rect x="12" y="-12" width="2" height="12" fill="#10B981" class="bar-bounce" style="transform-origin: bottom; animation-delay: 0.2s;"/>
  </g>

  <!-- Phrase 1 (Cyan Theme) -->
  <g clip-path="url(#clip1)">
    <text x="230" y="26" class="type-line hyper-glow" fill="#00DFD8">
      LEAD SYSTEMS ARCHITECT &amp; AI SPECIALIST <tspan fill="#38BDF8">[mathiya.cc]</tspan>
    </text>
  <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="2.3s" additive="sum" repeatCount="indefinite"/></g>

  <!-- Phrase 2 (Purple Theme) -->
  <g clip-path="url(#clip2)">
    <text x="230" y="26" class="type-line" fill="#E879F9">
      SCALABLE MULTI-AGENT AI ECOSYSTEMS <tspan fill="#C084FC">[SIVION SWARMS]</tspan>
    </text>
  <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="3.5s" additive="sum" repeatCount="indefinite"/></g>

  <!-- Phrase 3 (Emerald Theme) -->
  <g clip-path="url(#clip3)">
    <text x="230" y="26" class="type-line hyper-glow" fill="#34D399">
      LOW-LATENCY WINDOWS KERNEL TUNING <tspan fill="#10B981">[MA OPTIMIZER]</tspan>
    </text>
  <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="3.9s" additive="sum" repeatCount="indefinite"/></g>

  <!-- Phrase 4 (Amber & WebGL Theme) -->
  <g clip-path="url(#clip4)">
    <text x="230" y="26" class="type-line" fill="#FBBF24">
      WEBGL 2.0 &amp; GLSL GPGPU COMPUTE SHADERS <tspan fill="#F59E0B">[3D SPATIAL]</tspan>
    </text>
  <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="3.3s" additive="sum" repeatCount="indefinite"/></g>

  <!-- Right Telemetry Badge & Live Beacon -->
  <g transform="translate(775, 26)">
    <circle cx="0" cy="-3" r="3" fill="#00DFD8" class="beacon-dot hyper-glow"/>
    <text x="10" y="0" font-family="'Fira Code', monospace" font-size="9" font-weight="700" fill="#6E7681">60 FPS</text>
  <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="2.5s" additive="sum" repeatCount="indefinite"/></g>

    <g class="hyper-overlay-effects" style="pointer-events: none;">
        <!-- Scanning laser -->
        <rect x="0" y="0" width="100%" height="2" fill="#00DFD8" opacity="0.7" class="cyber-scanner" filter="drop-shadow(0 0 8px #00DFD8)">
            <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite"/>
        </rect>
        <rect x="0" y="-20" width="100%" height="40" fill="#FFFFFF" opacity="0.1" class="cyber-scanner" style="animation-delay: -0.1s"/>
        
        <!-- Vignette / Border flare -->
        <rect x="2" y="2" width="calc(100% - 4px)" height="calc(100% - 4px)" fill="none" stroke="rgba(0,223,216,0.3)" stroke-width="1" class="border-run"/>
    </g>
    </svg>
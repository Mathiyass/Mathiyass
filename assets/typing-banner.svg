<svg width="850" height="42" viewBox="0 0 850 42" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Glass Gradient -->
    <linearGradient id="typGlassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0E1422" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#06090E" stop-opacity="0.98" />
    </linearGradient>

    <!-- Chrome Border Gradient -->
    <linearGradient id="typBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Clip Paths for Typewriter Reveal -->
    <clipPath id="clip1">
      <rect x="180" y="0" width="0" height="42">
        <animate attributeName="width" 
                 values="0; 580; 580; 0; 0; 0; 0; 0; 0; 0; 0; 0" 
                 keyTimes="0; 0.08; 0.22; 0.25; 0.26; 0.50; 0.51; 0.75; 0.76; 0.98; 0.99; 1" 
                 dur="16s" 
                 repeatCount="indefinite" />
      </rect>
    </clipPath>

    <clipPath id="clip2">
      <rect x="180" y="0" width="0" height="42">
        <animate attributeName="width" 
                 values="0; 0; 0; 580; 580; 0; 0; 0; 0; 0; 0; 0" 
                 keyTimes="0; 0.25; 0.26; 0.34; 0.47; 0.50; 0.51; 0.75; 0.76; 0.98; 0.99; 1" 
                 dur="16s" 
                 repeatCount="indefinite" />
      </rect>
    </clipPath>

    <clipPath id="clip3">
      <rect x="180" y="0" width="0" height="42">
        <animate attributeName="width" 
                 values="0; 0; 0; 0; 0; 580; 580; 0; 0; 0; 0; 0" 
                 keyTimes="0; 0.50; 0.51; 0.52; 0.53; 0.59; 0.72; 0.75; 0.76; 0.98; 0.99; 1" 
                 dur="16s" 
                 repeatCount="indefinite" />
      </rect>
    </clipPath>

    <clipPath id="clip4">
      <rect x="180" y="0" width="0" height="42">
        <animate attributeName="width" 
                 values="0; 0; 0; 0; 0; 0; 0; 580; 580; 0; 0; 0" 
                 keyTimes="0; 0.75; 0.76; 0.77; 0.78; 0.84; 0.97; 0.99; 0.995; 0.998; 0.999; 1" 
                 dur="16s" 
                 repeatCount="indefinite" />
      </rect>
    </clipPath>

    <style>
      .term-prompt {
        font-family: 'Fira Code', 'SF Mono', Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        fill: #00DFD8;
        letter-spacing: 1px;
      }
      .type-line {
        font-family: 'Fira Code', 'SF Mono', Consolas, monospace;
        font-size: 12.5px;
        font-weight: 600;
        fill: #FFFFFF;
      }
      .cursor-blink {
        animation: curBlink 0.7s step-end infinite;
      }
      @keyframes curBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .beacon-dot {
        animation: bGlow 1.5s infinite alternate;
      }
      @keyframes bGlow {
        0% { opacity: 0.4; }
        100% { opacity: 1; filter: drop-shadow(0 0 6px #10B981); }
      }
    </style>
  </defs>

  <!-- 3D Glass Chassis Container -->
  <polygon points="6,2 844,2 848,6 848,36 844,40 6,40 2,36 2,6" fill="url(#typGlassBg)" stroke="url(#typBorder)" stroke-width="1.2" />

  <!-- Left Status & Terminal Prompt -->
  <g transform="translate(18, 25)">
    <circle cx="0" cy="-3" r="3.5" fill="#10B981" class="beacon-dot" />
    <text x="14" y="0" class="term-prompt">SYS://PROMPT ❯</text>
  </g>

  <!-- Phrase 1 (Cyan Theme) -->
  <g clip-path="url(#clip1)">
    <text x="180" y="25" class="type-line" fill="#00DFD8">
      LEAD SYSTEMS ARCHITECT &amp; AI SPECIALIST <tspan fill="#38BDF8">[mathiya.cc]</tspan>
    </text>
  </g>

  <!-- Phrase 2 (Purple Theme) -->
  <g clip-path="url(#clip2)">
    <text x="180" y="25" class="type-line" fill="#E879F9">
      SCALABLE MULTI-AGENT AI ECOSYSTEMS <tspan fill="#C084FC">[SIVION SWARMS]</tspan>
    </text>
  </g>

  <!-- Phrase 3 (Emerald Theme) -->
  <g clip-path="url(#clip3)">
    <text x="180" y="25" class="type-line" fill="#34D399">
      LOW-LATENCY WINDOWS KERNEL TUNING <tspan fill="#10B981">[MA OPTIMIZER]</tspan>
    </text>
  </g>

  <!-- Phrase 4 (Amber & WebGL Theme) -->
  <g clip-path="url(#clip4)">
    <text x="180" y="25" class="type-line" fill="#FBBF24">
      WEBGL 2.0 &amp; GLSL GPGPU COMPUTE SHADERS <tspan fill="#F59E0B">[3D SPATIAL]</tspan>
    </text>
  </g>

  <!-- Right Telemetry Badge & Live Beacon -->
  <g transform="translate(775, 25)">
    <circle cx="0" cy="-3" r="3" fill="#00DFD8" class="beacon-dot" />
    <text x="12" y="0" font-family="'Fira Code', monospace" font-size="9" font-weight="700" fill="#6E7681">LIVE</text>
  </g>
</svg>
<svg width="900" height="48" viewBox="0 0 900 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 3D Glass Chassis Gradient -->
    <linearGradient id="typeGlassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111726" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0E1422" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#06090E" stop-opacity="0.98" />
    </linearGradient>

    <!-- Top Specular Edge -->
    <linearGradient id="typeSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#00DFD8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </linearGradient>

    <!-- Chrome Border Gradient -->
    <linearGradient id="typeChromeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.95" />
    </linearGradient>

    <!-- Laser Scanning Beam -->
    <linearGradient id="typeScanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0" />
      <stop offset="50%" stop-color="#00DFD8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0" />
    </linearGradient>

    <style>
      .type-text {
        font-family: 'Fira Code', 'SF Mono', Consolas, monospace;
        font-size: 13.5px;
        font-weight: 700;
        fill: #00DFD8;
        letter-spacing: 1.5px;
        text-anchor: middle;
      }
      .type-prefix {
        font-family: 'Fira Code', 'SF Mono', Consolas, monospace;
        font-size: 12px;
        font-weight: 700;
        fill: #A855F7;
      }
      .cursor-blink {
        animation: blinkCursor 0.8s step-end infinite;
      }
      .hud-scanner {
        animation: scanType 4s ease-in-out infinite alternate;
      }
      .beacon-dot {
        animation: pulseBeacon 1.8s infinite alternate;
      }

      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes scanType {
        0% { transform: translateX(-400px); }
        100% { transform: translateX(400px); }
      }
      @keyframes pulseBeacon {
        0% { opacity: 0.4; }
        100% { opacity: 1; filter: drop-shadow(0 0 6px #00DFD8); }
      }
    </style>
  </defs>

  <!-- 3D Glass Outer Frame with Chamfers -->
  <polygon points="10,2 890,2 898,10 898,38 890,46 10,46 2,38 2,10" fill="url(#typeGlassBg)" stroke="url(#typeChromeBorder)" stroke-width="1.3" />
  <path d="M 10 3 L 890 3 L 896 9 L 4 9 Z" fill="url(#typeSpecular)" />

  <!-- Animated Scanning Laser Light -->
  <g class="hud-scanner">
    <rect x="350" y="3" width="200" height="42" fill="url(#typeScanBeam)" opacity="0.3" pointer-events="none" />
  </g>

  <!-- Left HUD Beacon & Bracket -->
  <g transform="translate(20, 24)">
    <circle cx="0" cy="0" r="3.5" fill="#00DFD8" class="beacon-dot" />
    <text x="14" y="4.5" class="type-prefix">SYS://PROMPT &gt;</text>
  </g>

  <!-- Animated Multi-Phrase Cycling Text -->
  <g transform="translate(450, 29)">
    <!-- Phrase 1: Lead Systems Architect -->
    <text x="0" y="0" class="type-text">
      LEAD SYSTEMS ARCHITECT &amp; DISTRIBUTED AI SPECIALIST
      <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.22;0.25;0.72;0.75;0.97;0.98;0.99;1" dur="12s" repeatCount="indefinite" />
    </text>

    <!-- Phrase 2: Multi-Agent AI -->
    <text x="0" y="0" class="type-text" fill="#A855F7">
      SCALABLE MULTI-AGENT AI ECOSYSTEMS (SIVION ENGINE)
      <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.24;0.26;0.48;0.50;0.74;0.76;0.98;1" dur="12s" repeatCount="indefinite" />
    </text>

    <!-- Phrase 3: Kernel Tuning -->
    <text x="0" y="0" class="type-text" fill="#10B981">
      LOW-LATENCY WINDOWS KERNEL TUNING (MA-OPTIMIZER • 0.42ms)
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.49;0.51;0.73;0.75;0.97;0.98;0.99;1" dur="12s" repeatCount="indefinite" />
    </text>

    <!-- Phrase 4: WebGL 3D -->
    <text x="0" y="0" class="type-text" fill="#38BDF8">
      144 FPS @ 4K WEBGL 2.0 &amp; GLSL GPGPU COMPUTE ENGINES
      <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" keyTimes="0;0.74;0.76;0.96;0.98;0.99;0.995;0.998;1" dur="12s" repeatCount="indefinite" />
    </text>
  </g>

  <!-- Right Blinking Cursor & Terminal Status -->
  <g transform="translate(860, 24)">
    <text x="-18" y="4.5" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#00DFD8" class="cursor-blink">█</text>
    <circle cx="16" cy="0" r="3.5" fill="#10B981" class="beacon-dot" />
  </g>
</svg>
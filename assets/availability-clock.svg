<svg width="900" height="96" viewBox="0 0 900 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 3D Glass Background Gradient -->
    <linearGradient id="clockGlassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111726" stop-opacity="0.94" />
      <stop offset="50%" stop-color="#0E1422" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#06090E" stop-opacity="0.98" />
    </linearGradient>

    <!-- Top Specular Edge -->
    <linearGradient id="clockSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#00DFD8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </linearGradient>

    <!-- Chrome Border Gradient -->
    <linearGradient id="clockChromeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.95" />
    </linearGradient>

    <style>
      .c-title { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 10.5px; font-weight: 700; fill: #00DFD8; letter-spacing: 1.5px; }
      .c-loc { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.5px; }
      .c-time { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 8.5px; font-weight: 700; fill: #00DFD8; }
      .c-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 8.5px; fill: #8B949E; }
      
      
      

      
    
      @keyframes dashFlow {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes dashFlowRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 40; }
      }
      .dash-flow {
        stroke-dasharray: 8, 6;
        animation: dashFlow 2s linear infinite;
      }
      .dash-flow-rev {
        stroke-dasharray: 8, 6;
        animation: dashFlowRev 2s linear infinite;
      }
    </style>
  </defs>

  <!-- 3D Glass Outer Frame with Chamfers -->
  <polygon points="12,2 888,2 898,12 898,84 888,94 12,94 2,84 2,12" fill="url(#clockGlassBg)" stroke="url(#clockChromeBorder)" stroke-width="1.3" />
  <path d="M 12 3 L 888 3 L 896 11 L 4 11 Z" fill="url(#clockSpecular)" />

  <!-- Header Banner -->
  <g transform="translate(20, 14)">
    <circle cx="6" cy="6" r="3.5" fill="#00DFD8" />
    
    
    <text x="18" y="9.5" class="c-title">GLOBAL AVAILABILITY // DUAL TIMEZONE COLLABORATION</text>
    <text x="860" y="9.5" text-anchor="end" class="c-title" fill="#10B981">COLLABORATION: OPEN</text>
    
    <line x1="0" y1="18" x2="860" y2="18" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <rect x="0" y="17" width="130" height="2" fill="#00DFD8" opacity="0.8">
      <animate attributeName="x" from="-130" to="860" dur="3s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Zone 1: Colombo (LK) -->
  <g transform="translate(30, 42)"><animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="3.4s" additive="sum" repeatCount="indefinite"/>
    <polygon points="6,0 259,0 265,6 265,36 259,42 6,42 0,36 0,6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 223, 216, 0.45)" stroke-width="1.2" />
    <path d="M 6 1 L 259 1 L 264 6 L 1 6 Z" fill="url(#clockSpecular)" />
    <!-- 3D Tilted Gyro Chronometer 1 -->
    <g transform="translate(10, 3)">
      <ellipse cx="18" cy="18" rx="16" ry="8" fill="none" stroke="#00DFD8" stroke-width="1" stroke-dasharray="4, 4">
        <animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="6s" repeatCount="indefinite" />
      </ellipse>
      <circle cx="18" cy="18" r="14" fill="#090D14" stroke="#00DFD8" stroke-width="1.2" />
      <line x1="18" y1="5" x2="18" y2="7" stroke="#00DFD8" stroke-width="1" />
      <line x1="18" y1="29" x2="18" y2="31" stroke="#00DFD8" stroke-width="1" />
      <line x1="5" y1="18" x2="7" y2="18" stroke="#00DFD8" stroke-width="1" />
      <line x1="29" y1="18" x2="31" y2="18" stroke="#00DFD8" stroke-width="1" />
      <!-- Sweep Second Hand (4s SMIL Rotation) -->
      <line x1="18" y1="18" x2="18" y2="6" stroke="#EF4444" stroke-width="1" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="4s" repeatCount="indefinite" />
      </line>
      <!-- Minute Hand (8s SMIL Rotation) -->
      <line x1="18" y1="18" x2="18" y2="8" stroke="#00DFD8" stroke-width="1.5" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="8s" repeatCount="indefinite" />
      </line>
      <!-- Hour Hand (48s SMIL Rotation) -->
      <line x1="18" y1="18" x2="25" y2="18" stroke="#34D399" stroke-width="2" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="48s" repeatCount="indefinite" />
      </line>
      
        <circle cx="18" cy="18" r="2" fill="#FFFFFF" />
        <!-- Orbiting Chronometer Photon Satellite -->
        <circle cx="18" cy="2" r="1.8" fill="#00DFD8" filter="drop-shadow(0 0 4px #00DFD8)">
          <animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="3.2s" repeatCount="indefinite" />
        </circle>
    </g>
    <text x="52" y="16" class="c-loc">🇱🇰 COLOMBO, LK</text>
    <text x="52" y="27" class="c-time">UTC+5:30 • ACTIVE TIMEZONE</text>
    <text x="52" y="37" class="c-desc">Lead Systems Architecture &amp; R&amp;D</text>
  </g>

  <!-- Zone 2: Birmingham (UK) -->
  <g transform="translate(315, 42)">
    <polygon points="6,0 259,0 265,6 265,36 259,42 6,42 0,36 0,6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.45)" stroke-width="1.2" />
    <path d="M 6 1 L 259 1 L 264 6 L 1 6 Z" fill="url(#clockSpecular)" />
    <!-- 3D Tilted Gyro Chronometer 2 -->
    <g transform="translate(10, 3)">
      <ellipse cx="18" cy="18" rx="16" ry="8" fill="none" stroke="#A855F7" stroke-width="1" stroke-dasharray="4, 4">
        <animateTransform attributeName="transform" type="rotate" from="360 18 18" to="0 18 18" dur="6s" repeatCount="indefinite" />
      </ellipse>
      <circle cx="18" cy="18" r="14" fill="#090D14" stroke="#A855F7" stroke-width="1.2" />
      <line x1="18" y1="5" x2="18" y2="7" stroke="#A855F7" stroke-width="1" />
      <line x1="18" y1="29" x2="18" y2="31" stroke="#A855F7" stroke-width="1" />
      <line x1="5" y1="18" x2="7" y2="18" stroke="#A855F7" stroke-width="1" />
      <line x1="29" y1="18" x2="31" y2="18" stroke="#A855F7" stroke-width="1" />
      <!-- Sweep Second Hand (4s SMIL Rotation) -->
      <line x1="18" y1="18" x2="18" y2="6" stroke="#EF4444" stroke-width="1" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="4s" repeatCount="indefinite" />
      </line>
      <!-- Minute Hand (8s SMIL Rotation) -->
      <line x1="18" y1="18" x2="18" y2="8" stroke="#E879F9" stroke-width="1.5" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="8s" repeatCount="indefinite" />
      </line>
      <!-- Hour Hand (48s SMIL Rotation) -->
      <line x1="18" y1="18" x2="13" y2="23" stroke="#A855F7" stroke-width="2" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="48s" repeatCount="indefinite" />
      </line>
      
        <circle cx="18" cy="18" r="2" fill="#FFFFFF" />
        <!-- Orbiting Chronometer Photon Satellite -->
        <circle cx="18" cy="2" r="1.8" fill="#00DFD8" filter="drop-shadow(0 0 4px #00DFD8)">
          <animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="3.2s" repeatCount="indefinite" />
        </circle>
    </g>
    <text x="52" y="16" class="c-loc">🇬🇧 BIRMINGHAM, UK</text>
    <text x="52" y="27" class="c-time" fill="#C084FC">UTC+1 (BST) • COLLABORATION</text>
    <text x="52" y="37" class="c-desc">Software Engineering &amp; Client Sync</text>
  </g>

  <!-- Zone 3: Engagement Status -->
  <g transform="translate(600, 42)">
    <polygon points="6,0 264,0 270,6 270,36 264,42 6,42 0,36 0,6" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.45)" stroke-width="1.2" />
    <path d="M 6 1 L 264 1 L 269 6 L 1 6 Z" fill="url(#clockSpecular)" />
    <g transform="translate(12, 10)">
      <circle cx="6" cy="6" r="4" fill="#10B981" />
      
      
    </g>
    <text x="32" y="17" class="c-loc" fill="#34D399">ENGAGEMENT STATUS</text>
    <text x="32" y="28" class="c-time" fill="#10B981">SELECT CONSULTATIONS OPEN</text>
    <text x="32" y="37" class="c-desc">Multi-Agent AI • 3D Shaders • Performance</text>
  </g>
</svg>
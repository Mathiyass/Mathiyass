<svg width="900" height="52" viewBox="0 0 900 52" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 3D Glass Chassis Gradient -->
    <linearGradient id="stripGlassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111726" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0E1422" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#06090E" stop-opacity="0.98" />
    </linearGradient>

    <!-- Top Specular Edge -->
    <linearGradient id="stripSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#00DFD8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </linearGradient>

    <!-- Chrome Border Gradient -->
    <linearGradient id="stripChromeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.95" />
    </linearGradient>

    <style>
      .qs-label { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 8px; font-weight: 700; fill: #8B949E; letter-spacing: 1px; }
      .qs-val { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #FFFFFF; }
      
      .pill-hover { animation: pillFloat 3s ease-in-out infinite alternate; }
      .p1 { animation-delay: 0s; }
      .p2 { animation-delay: 0.4s; }
      .p3 { animation-delay: 0.8s; }
      .p4 { animation-delay: 1.2s; }
      
      .star-spin { animation: starPulse 2s ease-in-out infinite alternate; }
      .beacon-dot { animation: pulseBeacon 1.8s infinite alternate; }

      @keyframes pillFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-2px); }
      }
      @keyframes starPulse {
        0% { transform: scale(0.9); filter: none; }
        100% { transform: scale(1.15); filter: drop-shadow(0 0 6px #FBBF24); }
      }
      @keyframes pulseBeacon {
        0% { opacity: 0.4; }
        100% { opacity: 1; filter: drop-shadow(0 0 6px #00DFD8); }
      }
    </style>
  </defs>

  <!-- 4 3D Glass Telemetry Pills -->

  <!-- Pill 1: Profile Views -->
  <g transform="translate(10, 4)" class="pill-hover p1">
    <polygon points="8,0 206,0 214,8 214,36 206,44 8,44 0,36 0,8" fill="url(#stripGlassBg)" stroke="rgba(0, 124, 240, 0.6)" stroke-width="1.2" />
    <path d="M 8 1 L 206 1 L 213 7 L 1 7 Z" fill="url(#stripSpecular)" />
    <g transform="translate(14, 22)">
      <ellipse cx="0" cy="0" rx="8" ry="4" fill="none" stroke="#007CF0" stroke-width="1" stroke-dasharray="2, 2">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite" />
      </ellipse>
      <circle cx="0" cy="0" r="2" fill="#007CF0" />
    </g>
    <text x="30" y="19" class="qs-label">PROFILE VIEWS</text>
    <text x="30" y="34" class="qs-val" fill="#38BDF8">15,400+ // GLOBAL</text>
  </g>

  <!-- Pill 2: Followers -->
  <g transform="translate(232, 4)" class="pill-hover p2">
    <polygon points="8,0 206,0 214,8 214,36 206,44 8,44 0,36 0,8" fill="url(#stripGlassBg)" stroke="rgba(0, 223, 216, 0.6)" stroke-width="1.2" />
    <path d="M 8 1 L 206 1 L 213 7 L 1 7 Z" fill="url(#stripSpecular)" />
    <g transform="translate(14, 22)">
      <ellipse cx="0" cy="0" rx="8" ry="4" fill="none" stroke="#00DFD8" stroke-width="1" stroke-dasharray="2, 2">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="4s" repeatCount="indefinite" />
      </ellipse>
      <circle cx="0" cy="0" r="2" fill="#00DFD8" />
    </g>
    <text x="30" y="19" class="qs-label">DEVELOPER NETWORK</text>
    <text x="30" y="34" class="qs-val" fill="#00DFD8">10+ FOLLOWERS</text>
  </g>

  <!-- Pill 3: Stars -->
  <g transform="translate(454, 4)" class="pill-hover p3">
    <polygon points="8,0 206,0 214,8 214,36 206,44 8,44 0,36 0,8" fill="url(#stripGlassBg)" stroke="rgba(119, 1, 208, 0.6)" stroke-width="1.2" />
    <path d="M 8 1 L 206 1 L 213 7 L 1 7 Z" fill="url(#stripSpecular)" />
    <g transform="translate(14, 22)">
      <text x="0" y="4" text-anchor="middle" font-size="12" class="star-spin">⭐</text>
    </g>
    <text x="30" y="19" class="qs-label">GITHUB STARS</text>
    <text x="30" y="34" class="qs-val" fill="#C084FC">12+ REPO STARS</text>
  </g>

  <!-- Pill 4: Repositories -->
  <g transform="translate(676, 4)" class="pill-hover p4">
    <polygon points="8,0 206,0 214,8 214,36 206,44 8,44 0,36 0,8" fill="url(#stripGlassBg)" stroke="rgba(16, 185, 129, 0.6)" stroke-width="1.2" />
    <path d="M 8 1 L 206 1 L 213 7 L 1 7 Z" fill="url(#stripSpecular)" />
    <g transform="translate(14, 22)">
      <ellipse cx="0" cy="0" rx="8" ry="4" fill="none" stroke="#10B981" stroke-width="1" stroke-dasharray="2, 2">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite" />
      </ellipse>
      <circle cx="0" cy="0" r="2" fill="#10B981" />
    </g>
    <text x="30" y="19" class="qs-label">PUBLIC REPOSITORIES</text>
    <text x="30" y="34" class="qs-val" fill="#34D399">13+ OPEN SOURCE</text>
  </g>
</svg>
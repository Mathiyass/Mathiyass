      </ellipse>
      <circle cx="0" cy="0" r="2.5" fill="#00DFD8" />
    </g>
    <text x="32" y="27" class="st-bay-title">🤖 MULTI-AGENT AI</text>
    
    <!-- Chips -->
    <g transform="translate(200, 11)">

<svg width="900" height="310" viewBox="0 0 900 310" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 3D Glass Chassis Gradient -->
    <linearGradient id="stackGlassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111726" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#0E1422" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#06090E" stop-opacity="0.98" />
    </linearGradient>

    <!-- Top Specular Edge Highlight -->
    <linearGradient id="stackSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#00DFD8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </linearGradient>

    <!-- Chrome Border Gradient -->
    <linearGradient id="stackChromeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.95" />
    </linearGradient>

    <style>
      .st-title { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 10.5px; font-weight: 700; fill: #00DFD8; letter-spacing: 1.5px; }
      .st-bay-title { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.5px; }
      .st-chip-text { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 8.5px; font-weight: 700; fill: #E2E8F0; }
      .st-meta { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 8px; font-weight: 700; }
      
      .chip-hover {
        animation: chipGlow 2.5s ease-in-out infinite alternate;
      }
      .laser-bus {
        stroke-dasharray: 4, 4;
        animation: busFlow 1s linear infinite;
      }
      .beacon-dot {
        animation: pulseBeacon 1.8s infinite alternate;
      }

      @keyframes chipGlow {
        0% { filter: none; }
        100% { filter: drop-shadow(0 0 6px currentColor); }
      }
      @keyframes busFlow {
        from { stroke-dashoffset: 8; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseBeacon {
        0% { opacity: 0.4; }
        100% { opacity: 1; filter: drop-shadow(0 0 6px #00DFD8); }
      }
    </style>
  </defs>

  <!-- 3D Glass Master Chassis -->
  <polygon points="14,2 886,2 898,14 898,296 886,308 14,308 2,296 2,14" fill="url(#stackGlassBg)" stroke="url(#stackChromeBorder)" stroke-width="1.3" />
  <path d="M 14 3 L 886 3 L 896 13 L 4 13 Z" fill="url(#stackSpecular)" />

  <!-- Top Title Ribbon -->
  <g transform="translate(20, 16)">
    <circle cx="6" cy="6" r="3.5" fill="#00DFD8" class="beacon-dot" />
    <text x="18" y="9.5" class="st-title">TECHNOLOGY &amp; ARCHITECTURAL STACK MATRIX // 60 FPS HUD</text>
    <text x="860" y="9.5" text-anchor="end" class="st-title" fill="#10B981">SYS-STACK-v3.0 [READY]</text>
    <line x1="0" y1="18" x2="860" y2="18" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  </g>

  <!-- ==================== BAY 1: MULTI-AGENT AI & INTELLIGENT SYSTEMS ==================== -->
  <g transform="translate(24, 44)">

      <rect x="315" y="0" width="115" height="24" rx="4" fill="rgba(0, 223, 216, 0.12)" stroke="#00DFD8" stroke-width="1" />
      <text x="372.5" y="16" text-anchor="middle" class="st-chip-text" fill="#00DFD8">pgvector RAG</text>

      <rect x="440" y="0" width="80" height="24" rx="4" fill="rgba(0, 223, 216, 0.12)" stroke="#00DFD8" stroke-width="1" />

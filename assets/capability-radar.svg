<svg width="900" height="180" viewBox="0 0 900 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="radarBgSupreme" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131E" />
      <stop offset="100%" stop-color="#06090F" />
    </linearGradient>

    <linearGradient id="radarBorderSupreme" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7701D0" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweepSupreme" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.65" />
      <stop offset="60%" stop-color="#00DFD8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0" />
    </linearGradient>

    <style>
      .r-title { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #00DFD8; letter-spacing: 1.5px; }
      .r-label { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 8.5px; font-weight: 700; fill: #FFFFFF; }
      .r-coord { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 7.5px; fill: #8B949E; }
      .r-val { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 8.5px; font-weight: 700; }
      
      .radar-ping-node {
        animation: pingNode 2s ease-in-out infinite alternate;
      }
      .radar-reticle-spin {
        animation: spinReticle 30s linear infinite;
      }

      @keyframes pingNode {
        0% { opacity: 0.4; }
        100% { opacity: 1; filter: drop-shadow(0 0 6px #00DFD8); }
      }
      @keyframes spinReticle {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Frame with Chamfers -->
  <polygon points="12,2 888,2 898,12 898,168 888,178 12,178 2,168 2,12" fill="url(#radarBgSupreme)" stroke="url(#radarBorderSupreme)" stroke-width="1.3" />

  <!-- Top Title Bar -->
  <g transform="translate(20, 16)">
    <circle cx="6" cy="6" r="3.5" fill="#00DFD8" />
    <text x="18" y="9.5" class="r-title">ARCHITECTURAL CAPABILITY RADAR // METRICS</text>
    <text x="860" y="9.5" text-anchor="end" class="r-title" fill="#10B981">SYS-RADAR // ACTIVE 360° SWEEP</text>
    <line x1="0" y1="18" x2="860" y2="18" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  </g>

  <!-- Circular Military-Grade Radar HUD (Left) -->
  <g transform="translate(45, 42)">
    <!-- Concentric Range Rings -->
    <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(0, 223, 216, 0.25)" stroke-width="1" />
    <circle cx="60" cy="60" r="38" fill="none" stroke="rgba(0, 223, 216, 0.2)" stroke-width="1" stroke-dasharray="4, 4" />
    <circle cx="60" cy="60" r="22" fill="none" stroke="rgba(0, 223, 216, 0.2)" stroke-width="1" />

    <!-- Crosshair Lines -->
    <line x1="6" y1="60" x2="114" y2="60" stroke="rgba(0, 223, 216, 0.3)" stroke-width="1" />
    <line x1="60" y1="6" x2="60" y2="114" stroke="rgba(0, 223, 216, 0.3)" stroke-width="1" />

    <!-- Degree Markings -->
    <text x="60" y="5" text-anchor="middle" class="r-coord">000°</text>
    <text x="120" y="63" class="r-coord">090°</text>
    <text x="60" y="122" text-anchor="middle" class="r-coord">180°</text>
    <text x="0" y="63" class="r-coord">270°</text>

    <!-- Radar Polygon (Pentagon of Capabilities) -->
    <polygon points="60,16 100,42 88,96 32,96 20,42" fill="rgba(0, 223, 216, 0.15)" stroke="#00DFD8" stroke-width="1.5" />

    <!-- 360° Continuous Rotating Radar Sweep Beam with Pure SMIL Rotation -->
    <g>
      <path d="M 60 60 L 60 6 A 54 54 0 0 1 105 28 Z" fill="url(#radarSweepSupreme)">
        <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="4.5s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Radar Vertex Nodes -->
    <circle cx="60" cy="16" r="3" fill="#00DFD8" class="radar-ping-node" />
    <circle cx="100" cy="42" r="3" fill="#00DFD8" class="radar-ping-node" />
    <circle cx="88" cy="96" r="3" fill="#00DFD8" class="radar-ping-node" />
    <circle cx="32" cy="96" r="3" fill="#00DFD8" class="radar-ping-node" />
    <circle cx="20" cy="42" r="3" fill="#00DFD8" class="radar-ping-node" />
  </g>

  <!-- Competency Progress Gauges (Right) -->
  <g transform="translate(240, 44)">
    <!-- Metric 1 -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="3.5" fill="#00DFD8" />
      <text x="18" y="9" class="r-label">Multi-Agent AI &amp; Autonomous LLM Swarms</text>
      <text x="590" y="9" text-anchor="end" class="r-val" fill="#00DFD8">98% // EXPERT</text>
      <rect x="18" y="14" width="572" height="6" rx="3" fill="rgba(255, 255, 255, 0.05)" />
      <rect x="18" y="14" width="560" height="6" rx="3" fill="#00DFD8" />
    </g>

    <!-- Metric 2 -->
    <g transform="translate(0, 27)">
      <circle cx="6" cy="6" r="3.5" fill="#A855F7" />
      <text x="18" y="9" class="r-label">WebGL 2.0, Three.js &amp; GLSL Compute Shaders</text>
      <text x="590" y="9" text-anchor="end" class="r-val" fill="#C084FC">95% // HIGH-PERF</text>
      <rect x="18" y="14" width="572" height="6" rx="3" fill="rgba(255, 255, 255, 0.05)" />
      <rect x="18" y="14" width="543" height="6" rx="3" fill="#A855F7" />
    </g>

    <!-- Metric 3 -->
    <g transform="translate(0, 54)">
      <circle cx="6" cy="6" r="3.5" fill="#10B981" />
      <text x="18" y="9" class="r-label">Kernel Tuning, Windows API &amp; Low-Latency Architecture</text>
      <text x="590" y="9" text-anchor="end" class="r-val" fill="#34D399">96% // 0.42ms DISPATCH</text>
      <rect x="18" y="14" width="572" height="6" rx="3" fill="rgba(255, 255, 255, 0.05)" />
      <rect x="18" y="14" width="549" height="6" rx="3" fill="#10B981" />
    </g>

    <!-- Metric 4 -->
    <g transform="translate(0, 81)">
      <circle cx="6" cy="6" r="3.5" fill="#0284C7" />
      <text x="18" y="9" class="r-label">Distributed Cloud, Next.js 16 &amp; Realtime Supabase</text>
      <text x="590" y="9" text-anchor="end" class="r-val" fill="#38BDF8">97% // SCALABLE</text>
      <rect x="18" y="14" width="572" height="6" rx="3" fill="rgba(255, 255, 255, 0.05)" />
      <rect x="18" y="14" width="555" height="6" rx="3" fill="#0284C7" />
    </g>
  </g>
</svg>
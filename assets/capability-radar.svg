<svg width="900" height="230" viewBox="0 0 900 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="radarBgSupreme" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1420" />
      <stop offset="100%" stop-color="#06090F" />
    </linearGradient>

    <linearGradient id="radarBorderSupreme" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7701D0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="sweepGradSupreme" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0" />
    </linearGradient>

    <style>
      .r-label { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 11px; font-weight: 700; fill: #FFFFFF; }
      .r-val { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #00DFD8; }
      .r-deg { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 7.5px; fill: #8B949E; }
      .r-ring { stroke: rgba(0, 223, 216, 0.22); stroke-width: 1; }
      .r-axis { stroke: rgba(48, 54, 61, 0.9); stroke-width: 1; stroke-dasharray: 3, 3; }
      
      .radar-sweep {
        transform-origin: 120px 115px;
        animation: radarSpin 5s linear infinite;
      }
      .radar-ping {
        animation: radarPing 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }

      @keyframes radarSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes radarPing {
        0% { r: 10; opacity: 0.8; }
        100% { r: 92; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Frame Background with Chamfered Silhouette -->
  <polygon points="16,2 884,2 898,16 898,214 884,228 16,228 2,214 2,16" fill="url(#radarBgSupreme)" stroke="url(#radarBorderSupreme)" stroke-width="1.3" />

  <!-- LEFT: Radar Visualizer (Center at 120, 115) -->
  <g id="radar-visualizer">
    <!-- Degree Indicators -->
    <text x="120" y="14" text-anchor="middle" class="r-deg">000° N</text>
    <text x="222" y="118" class="r-deg">090° E</text>
    <text x="120" y="222" text-anchor="middle" class="r-deg">180° S</text>
    <text x="12" y="118" class="r-deg">270° W</text>

    <!-- Concentric Rings -->
    <circle cx="120" cy="115" r="25" class="r-ring" />
    <circle cx="120" cy="115" r="50" class="r-ring" />
    <circle cx="120" cy="115" r="75" class="r-ring" stroke-opacity="0.4" />
    <circle cx="120" cy="115" r="92" class="r-ring" stroke="rgba(0, 223, 216, 0.5)" stroke-width="1.5" />

    <!-- Expanding Ping Ripple -->
    <circle cx="120" cy="115" r="40" fill="none" stroke="#00DFD8" stroke-width="1.5" class="radar-ping" />

    <!-- Crosshair Axes -->
    <line x1="25" y1="115" x2="215" y2="115" class="r-axis" />
    <line x1="120" y1="20" x2="120" y2="210" class="r-axis" />

    <!-- Radar Polygon Data Area -->
    <polygon points="120,28 192,68 178,165 65,170 42,74" fill="rgba(0, 223, 216, 0.18)" stroke="#00DFD8" stroke-width="1.8" />
    <circle cx="120" cy="28" r="3.5" fill="#00DFD8" />
    <circle cx="192" cy="68" r="3.5" fill="#00DFD8" />
    <circle cx="178" cy="165" r="3.5" fill="#7701D0" />
    <circle cx="65" cy="170" r="3.5" fill="#7701D0" />
    <circle cx="42" cy="74" r="3.5" fill="#00DFD8" />

    <!-- Rotating Radar Sweep Beam -->
    <g class="radar-sweep">
      <path d="M 120 115 L 120 23 A 92 92 0 0 1 200 69 Z" fill="url(#sweepGradSupreme)" />
      <line x1="120" y1="115" x2="120" y2="23" stroke="#00DFD8" stroke-width="1.6" />
    </g>
    <circle cx="120" cy="115" r="4.5" fill="#00DFD8" />
  </g>

  <!-- RIGHT: Capability Breakdown Grid -->
  <g transform="translate(255, 34)">
    <!-- Header Title -->
    <text x="0" y="0" class="r-label" fill="#00DFD8" font-size="12" letter-spacing="2">ARCHITECTURAL CAPABILITY RADAR // METRICS</text>
    <line x1="0" y1="10" x2="600" y2="10" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Skill 1: Multi-Agent AI -->
    <g transform="translate(0, 32)">
      <text x="0" y="0" class="r-label">🤖 Multi-Agent AI &amp; LLM Swarms</text>
      <text x="590" y="0" text-anchor="end" class="r-val">98%</text>
      <rect x="0" y="8" width="590" height="6" rx="3" fill="#141922" />
      <rect x="0" y="8" width="578" height="6" rx="3" fill="url(#radarBorderSupreme)" />
    </g>

    <!-- Skill 2: WebGL & Shaders -->
    <g transform="translate(0, 66)">
      <text x="0" y="0" class="r-label">🎮 WebGL 2.0, Three.js &amp; GLSL Compute</text>
      <text x="590" y="0" text-anchor="end" class="r-val">95%</text>
      <rect x="0" y="8" width="590" height="6" rx="3" fill="#141922" />
      <rect x="0" y="8" width="560" height="6" rx="3" fill="url(#radarBorderSupreme)" />
    </g>

    <!-- Skill 3: Low-Level & OS Tuning -->
    <g transform="translate(0, 100)">
      <text x="0" y="0" class="r-label">⚡ Kernel Tuning, Windows API &amp; Low-Latency</text>
      <text x="590" y="0" text-anchor="end" class="r-val" fill="#C4B5FD">96%</text>
      <rect x="0" y="8" width="590" height="6" rx="3" fill="#141922" />
      <rect x="0" y="8" width="566" height="6" rx="3" fill="url(#radarBorderSupreme)" />
    </g>

    <!-- Skill 4: Distributed Cloud & Full-Stack -->
    <g transform="translate(0, 134)">
      <text x="0" y="0" class="r-label">☁️ Distributed Cloud, Next.js 16 &amp; Supabase</text>
      <text x="590" y="0" text-anchor="end" class="r-val" fill="#10B981">97%</text>
      <rect x="0" y="8" width="590" height="6" rx="3" fill="#141922" />
      <rect x="0" y="8" width="572" height="6" rx="3" fill="url(#radarBorderSupreme)" />
    </g>
  </g>
</svg>
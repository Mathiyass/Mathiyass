<svg width="900" height="180" viewBox="0 0 900 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="radarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131E" />
      <stop offset="100%" stop-color="#06090F" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="radarBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7701D0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00DFD8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0" />
    </linearGradient>

    <style>
      .r-title { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 10px; font-weight: 700; fill: #00DFD8; letter-spacing: 1.5px; }
      .r-label { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 8px; font-weight: 700; fill: #FFFFFF; }
      .r-coord { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 7.5px; fill: #8B949E; }
      
      .radar-sweep-beam {
        transform-origin: 100px 100px;
        animation: radarSpin 5s linear infinite;
      }
      .radar-sweep-beam-trail {
        transform-origin: 100px 100px;
        animation: radarSpin 5s linear infinite;
        animation-delay: -0.15s;
        opacity: 0.4;
      }

      .radar-ping-node {
        animation: pingNode 2s ease-in-out infinite alternate;
      }

      @keyframes radarSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes pingNode {
        0% { opacity: 0.4; }
        100% { opacity: 1; filter: drop-shadow(0 0 6px #00DFD8); }
      }
    </style>
  </defs>

  <!-- Outer Glass Frame with Chamfers -->
  <polygon points="12,2 888,2 898,12 898,168 888,178 12,178 2,168 2,12" fill="url(#radarBg)" stroke="url(#radarBorder)" stroke-width="1.2" />

  <!-- Top Title Bar -->
  <g transform="translate(20, 16)">
    <circle cx="6" cy="6" r="3.5" fill="#00DFD8" />
    <text x="18" y="9.5" class="r-title">ARCHITECTURAL CAPABILITY RADAR // METRICS</text>
    <text x="860" y="9.5" text-anchor="end" class="r-title" fill="#10B981">SYS-RADAR // ACTIVE SCAN</text>
    <line x1="0" y1="18" x2="860" y2="18" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  </g>

  <!-- Circular Radar HUD (Left) -->
  <g transform="translate(40, 42)">
    <!-- Radar Rings -->
    <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(0, 223, 216, 0.2)" stroke-width="1" />
    <circle cx="60" cy="60" r="35" fill="none" stroke="rgba(0, 223, 216, 0.2)" stroke-width="1" />
    <circle cx="60" cy="60" r="20" fill="none" stroke="rgba(0, 223, 216, 0.2)" stroke-width="1" />

    <!-- Crosshair Lines -->
    <line x1="10" y1="60" x2="110" y2="60" stroke="rgba(0, 223, 216, 0.25)" stroke-width="1" />
    <line x1="60" y1="10" x2="60" y2="110" stroke="rgba(0, 223, 216, 0.25)" stroke-width="1" />

    <!-- Degree Markings -->
    <text x="60" y="8" text-anchor="middle" class="r-coord">000°</text>
    <text x="116" y="62" class="r-coord">090°</text>
    <text x="60" y="118" text-anchor="middle" class="r-coord">180°</text>
    <text x="4" y="62" class="r-coord">270°</text>

    <!-- Radar Polygon (Pentagon) -->
    <polygon points="60,18 98,42 85,92 35,92 22,42" fill="rgba(0, 223, 216, 0.15)" stroke="#00DFD8" stroke-width="1.5" />

    <!-- Rotating Radar Sweep Beam with Trail -->
    <g transform="translate(-40, -40)">
      <path d="M 100 100 L 100 50 A 50 50 0 0 1 135 65 Z" fill="url(#radarSweep)" class="radar-sweep-beam" />
      <path d="M 100 100 L 100 50 A 50 50 0 0 1 135 65 Z" fill="url(#radarSweep)" class="radar-sweep-beam-trail" />
    </g>

    <!-- Vertex Data Nodes -->
    <circle cx="60" cy="18" r="3" fill="#00DFD8" class="radar-ping-node" />
    <circle cx="98" cy="42" r="3" fill="#00DFD8" class="radar-ping-node" />
    <circle cx="85" cy="92" r="3" fill="#00DFD8" class="radar-ping-node" />
    <circle cx="35" cy="92" r="3" fill="#00DFD8" class="radar-ping-node" />
    <circle cx="22" cy="42" r="3" fill="#00DFD8" class="radar-ping-node" />
  </g>

  <!-- Competency Progress Gauges (Right) -->
  <g transform="translate(240, 48)">
    <!-- Metric 1 -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="3" fill="#00DFD8" />
      <text x="16" y="9" class="r-label">Multi-Agent AI &amp; LLM Swarms</text>
      <text x="600" y="9" text-anchor="end" class="r-label" fill="#00DFD8">98%</text>
      <rect x="16" y="14" width="584" height="4" rx="2" fill="rgba(255, 255, 255, 0.05)" />
      <rect x="16" y="14" width="572" height="4" rx="2" fill="#00DFD8" />
    </g>

    <!-- Metric 2 -->
    <g transform="translate(0, 26)">
      <circle cx="6" cy="6" r="3" fill="#A855F7" />
      <text x="16" y="9" class="r-label">WebGL 2.0, Three.js &amp; GLSL Compute</text>
      <text x="600" y="9" text-anchor="end" class="r-label" fill="#A855F7">95%</text>
      <rect x="16" y="14" width="584" height="4" rx="2" fill="rgba(255, 255, 255, 0.05)" />
      <rect x="16" y="14" width="555" height="4" rx="2" fill="#A855F7" />
    </g>

    <!-- Metric 3 -->
    <g transform="translate(0, 52)">
      <circle cx="6" cy="3" r="3" fill="#10B981" />
      <text x="16" y="9" class="r-label">Kernel Tuning, Windows API &amp; Low-Latency</text>
      <text x="600" y="9" text-anchor="end" class="r-label" fill="#10B981">96%</text>
      <rect x="16" y="14" width="584" height="4" rx="2" fill="rgba(255, 255, 255, 0.05)" />
      <rect x="16" y="14" width="560" height="4" rx="2" fill="#10B981" />
    </g>

    <!-- Metric 4 -->
    <g transform="translate(0, 78)">
      <circle cx="6" cy="3" r="3" fill="#0284C7" />
      <text x="16" y="9" class="r-label">Distributed Cloud, Next.js 16 &amp; Supabase</text>
      <text x="600" y="9" text-anchor="end" class="r-label" fill="#0284C7">97%</text>
      <rect x="16" y="14" width="584" height="4" rx="2" fill="rgba(255, 255, 255, 0.05)" />
      <rect x="16" y="14" width="566" height="4" rx="2" fill="#0284C7" />
    </g>
  </g>
</svg>
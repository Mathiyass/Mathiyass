<svg width="480" height="96" viewBox="0 0 480 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spotBgSupreme" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111622" />
      <stop offset="100%" stop-color="#080B10" />
    </linearGradient>

    <linearGradient id="spotBorderSupreme" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1DB954" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00DFD8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1DB954" stop-opacity="0.8" />
    </linearGradient>

    <style>
      .track-title { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #FFFFFF; }
      .track-artist { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; fill: #8B949E; }
      .spot-label { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 8.5px; font-weight: 700; fill: #1DB954; letter-spacing: 1.5px; }
      .spot-time { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 8px; fill: #6E7681; }
      
      .eq-bar {
        transform-origin: bottom;
        animation: bounceEq 1.2s ease-in-out infinite alternate;
      }
      .b1 { animation-delay: 0.05s; }
      .b2 { animation-delay: 0.35s; }
      .b3 { animation-delay: 0.15s; }
      .b4 { animation-delay: 0.55s; }
      .b5 { animation-delay: 0.25s; }
      .b6 { animation-delay: 0.45s; }
      .b7 { animation-delay: 0.10s; }
      .b8 { animation-delay: 0.60s; }
      .b9 { animation-delay: 0.30s; }
      .b10 { animation-delay: 0.50s; }
      .b11 { animation-delay: 0.20s; }
      .b12 { animation-delay: 0.40s; }
      
      .spot-pulse {
        animation: pulseSpot 2s ease-in-out infinite alternate;
      }

      @keyframes bounceEq {
        0% { transform: scaleY(0.2); }
        100% { transform: scaleY(1); }
      }

      @keyframes pulseSpot {
        0% { filter: drop-shadow(0 0 4px rgba(29, 185, 84, 0.3)); }
        100% { filter: drop-shadow(0 0 12px rgba(29, 185, 84, 0.8)); }
      }
    </style>
  </defs>

  <!-- Card Frame with Chamfered Corners -->
  <polygon points="10,2 470,2 478,10 478,86 470,94 10,94 2,86 2,10" fill="url(#spotBgSupreme)" stroke="url(#spotBorderSupreme)" stroke-width="1.2" />

  <!-- Spotify Logo & Icon with Radiant Aura -->
  <g transform="translate(16, 20)" class="spot-pulse">
    <circle cx="28" cy="28" r="26" fill="#1DB954" />
    <path d="M 38 23 C 30 18 18 17.5 11 19.5 C 10 19.8 8.8 19.2 8.5 18 C 8.2 16.8 8.8 15.6 10 15.3 C 18 12.8 31.5 13.3 40.5 18.8 C 41.5 19.4 41.8 20.7 41.2 21.7 C 40.6 22.7 39.2 23 38 23 Z" fill="#080B10" />
    <path d="M 35 29.5 C 30.5 26.8 20.8 25.6 13.2 27.9 C 12.2 28.2 11.2 27.6 10.9 26.7 C 10.6 25.7 11.2 24.7 12.1 24.4 C 20.8 21.8 31.7 23.1 37.1 26.4 C 38 27 38.2 28 37.7 28.9 C 37.2 29.7 36 30 35 29.5 Z" fill="#080B10" />
    <path d="M 32.5 36 C 29 33.8 21.6 33.1 15.2 35 C 14.4 35.2 13.6 34.8 13.4 34 C 13.2 33.3 13.6 32.5 14.4 32.3 C 21.6 30.1 29.8 30.8 34.1 33.5 C 34.8 33.9 35 34.8 34.6 35.5 C 34.2 36.2 33.3 36.4 32.5 36 Z" fill="#080B10" />
  </g>

  <!-- Track Meta -->
  <text x="82" y="30" class="spot-label">● AUDIO STREAM // HIGH-FIDELITY FLAC</text>
  <text x="82" y="49" class="track-title">Cyberpunk Synthwave &amp; Systems Flow</text>
  <text x="82" y="66" class="track-artist">Curated Architect Soundtracks • 24-Bit / 96kHz</text>
  <text x="82" y="80" class="spot-time">02:48 / 03:15 • STREAMING LIVE</text>

  <!-- 12-Band Equalizer -->
  <g transform="translate(390, 68)">
    <rect x="0" y="-30" width="3" height="30" rx="1.5" fill="#00DFD8" class="eq-bar b1" />
    <rect x="5" y="-30" width="3" height="30" rx="1.5" fill="#00DFD8" class="eq-bar b2" />
    <rect x="10" y="-30" width="3" height="30" rx="1.5" fill="#1DB954" class="eq-bar b3" />
    <rect x="15" y="-30" width="3" height="30" rx="1.5" fill="#1DB954" class="eq-bar b4" />
    <rect x="20" y="-30" width="3" height="30" rx="1.5" fill="#10B981" class="eq-bar b5" />
    <rect x="25" y="-30" width="3" height="30" rx="1.5" fill="#10B981" class="eq-bar b6" />
    <rect x="30" y="-30" width="3" height="30" rx="1.5" fill="#00DFD8" class="eq-bar b7" />
    <rect x="35" y="-30" width="3" height="30" rx="1.5" fill="#00DFD8" class="eq-bar b8" />
    <rect x="40" y="-30" width="3" height="30" rx="1.5" fill="#1DB954" class="eq-bar b9" />
    <rect x="45" y="-30" width="3" height="30" rx="1.5" fill="#1DB954" class="eq-bar b10" />
    <rect x="50" y="-30" width="3" height="30" rx="1.5" fill="#10B981" class="eq-bar b11" />
    <rect x="55" y="-30" width="3" height="30" rx="1.5" fill="#10B981" class="eq-bar b12" />
  </g>
</svg>
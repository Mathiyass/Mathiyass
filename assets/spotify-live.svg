  <defs>
    <!-- 3D Glass Chassis Gradient -->
    <linearGradient id="spotGlassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#0E1422" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#06090E" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Top Specular Edge Highlight -->
    <linearGradient id="spotSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#1DB954" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </linearGradient>

    <!-- Chrome Border Gradient -->
    <linearGradient id="spotChromeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1DB954" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#00DFD8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1DB954" stop-opacity="0.95"/>
    </linearGradient>

    <style>
.track-title { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 12px; font-weight: 700; fill: #FFFFFF; }
    .track-artist { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #8B949E; }
    .spot-label { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 8.5px; font-weight: 700; fill: #1DB954; }
    .eq-bar-1 { animation: eqBounce1 0.8s ease-in-out infinite alternate; transform-origin: bottom; }
    .eq-bar-2 { animation: eqBounce2 1.1s ease-in-out infinite alternate; transform-origin: bottom; }
    .eq-bar-3 { animation: eqBounce3 0.7s ease-in-out infinite alternate; transform-origin: bottom; }
    .eq-bar-4 { animation: eqBounce4 1.3s ease-in-out infinite alternate; transform-origin: bottom; }
    @keyframes eqBounce1 { 0% { transform: scaleY(0.3); } 100% { transform: scaleY(1); } }
    @keyframes eqBounce2 { 0% { transform: scaleY(0.8); } 100% { transform: scaleY(0.2); } }
    @keyframes eqBounce3 { 0% { transform: scaleY(0.2); } 100% { transform: scaleY(0.9); } }
    @keyframes eqBounce4 { 0% { transform: scaleY(0.9); } 100% { transform: scaleY(0.4); } }
  

/* CONTINUOUS HIGH-FPS CYBER ANIMATIONS (NO PULSE, NO GLITCH) */
@keyframes cyber-scan {
  0% { transform: translateY(-100%); }
  100% { transform: translateY(1000%); }
}
@keyframes border-run {
  0% { stroke-dashoffset: 1000; }
  100% { stroke-dashoffset: 0; }
}
@keyframes dash-flow {
  0% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: -200; }
}
@keyframes dash-flow-reverse {
  0% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 200; }
}
@keyframes particle-drift {
  0% { transform: translate(0, 0); }
  50% { transform: translate(var(--dx), var(--dy)); }
  100% { transform: translate(0, 0); }
}

.cyber-scanner { 
  animation: cyber-scan 3.5s linear infinite; 
  opacity: 0.45; 
}
.border-run { 
  stroke-dasharray: 100 200; 
  animation: border-run 5s linear infinite; 
}
.dash-flow { 
  stroke-dasharray: 8 6; 
  animation: dash-flow 2.5s linear infinite; 
}
.dash-flow-reverse { 
  stroke-dasharray: 12 8; 
  animation: dash-flow-reverse 3.5s linear infinite; 
}
.hyper-glow { 
  filter: drop-shadow(0 0 4px rgba(0, 223, 216, 0.4)); 
}
.purple-glow { 
  filter: drop-shadow(0 0 4px rgba(168, 85, 247, 0.4)); 
}
</style>

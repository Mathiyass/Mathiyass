<svg width="480" height="96" viewBox="0 0 480 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12171F" />
      <stop offset="100%" stop-color="#090C10" />
    </linearGradient>

    <linearGradient id="spotBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1DB954" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00DFD8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1DB954" stop-opacity="0.6" />
    </linearGradient>

    <style>
      .track-title { font-family: 'SF Mono', Consolas, monospace; font-size: 13px; font-weight: 700; fill: #FFFFFF; }
      .track-artist { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #8B949E; }
      .spot-label { font-family: 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #1DB954; letter-spacing: 1.5px; }
      
      .eq-bar {
        transform-origin: bottom;
        animation: bounce 1.4s ease-in-out infinite alternate;
      }
      .b1 { animation-delay: 0.1s; }
      .b2 { animation-delay: 0.4s; }
      .b3 { animation-delay: 0.2s; }
      .b4 { animation-delay: 0.6s; }
      .b5 { animation-delay: 0.3s; }
      .b6 { animation-delay: 0.5s; }
      
      @keyframes bounce {
        0% { transform: scaleY(0.25); }
        100% { transform: scaleY(1); }
      }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect x="1" y="1" width="478" height="94" rx="12" fill="url(#spotBg)" stroke="url(#spotBorder)" stroke-width="1.2" />

  <!-- Spotify Logo & Icon -->
  <g transform="translate(18, 20)">
    <circle cx="28" cy="28" r="28" fill="#1DB954" />
    <path d="M 39.5 22.8 C 30.5 17.5 17.7 17.1 10.3 19.3 C 9.1 19.7 7.8 19 7.4 17.8 C 7 16.6 7.7 15.3 8.9 14.9 C 17.5 12.3 31.7 12.8 41.9 18.8 C 43 19.4 43.4 20.9 42.7 21.9 C 42.1 23 40.6 23.4 39.5 22.8 Z" fill="#090C10" />
    <path d="M 36.2 30.1 C 31.4 27.2 20.8 25.9 12.7 28.4 C 11.7 28.7 10.6 28.1 10.3 27.1 C 10 26.1 10.6 25 11.6 24.7 C 20.9 21.9 32.6 23.3 38.4 26.9 C 39.3 27.5 39.6 28.6 39.1 29.6 C 38.5 30.4 37.3 30.7 36.2 30.1 Z" fill="#090C10" />
    <path d="M 33.6 37.2 C 29.8 34.9 21.8 34.1 14.9 36.2 C 14.1 36.4 13.2 36 13 35.1 C 12.8 34.3 13.2 33.4 14.1 33.2 C 21.8 30.9 30.7 31.7 35.3 34.6 C 36.1 35.1 36.3 36.1 35.9 36.8 C 35.4 37.6 34.4 37.8 33.6 37.2 Z" fill="#090C10" />
  </g>

  <!-- Track Meta -->
  <text x="88" y="32" class="spot-label">● AUDIO TELEMETRY // SPOTIFY STREAM</text>
  <text x="88" y="52" class="track-title">Cyberpunk Synthwave &amp; Systems Focus</text>
  <text x="88" y="70" class="track-artist">Curated Developer Soundtracks • High Frequency</text>

  <!-- Equalizer Animation (Right Side) -->
  <g transform="translate(415, 62)">
    <rect x="0" y="-30" width="4" height="30" rx="2" fill="#1DB954" class="eq-bar b1" />
    <rect x="7" y="-30" width="4" height="30" rx="2" fill="#00DFD8" class="eq-bar b2" />
    <rect x="14" y="-30" width="4" height="30" rx="2" fill="#1DB954" class="eq-bar b3" />
    <rect x="21" y="-30" width="4" height="30" rx="2" fill="#00DFD8" class="eq-bar b4" />
    <rect x="28" y="-30" width="4" height="30" rx="2" fill="#1DB954" class="eq-bar b5" />
    <rect x="35" y="-30" width="4" height="30" rx="2" fill="#00DFD8" class="eq-bar b6" />
  </g>
</svg>
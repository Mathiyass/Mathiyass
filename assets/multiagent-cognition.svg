<svg width="900" height="120" viewBox="0 0 900 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111622" />
      <stop offset="100%" stop-color="#070A0F" />
    </linearGradient>

    <!-- Outer Frame Gradient -->
    <linearGradient id="cogBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7701D0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.8" />
    </linearGradient>

    <style>
      .cog-title { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 10px; font-weight: 700; fill: #00DFD8; letter-spacing: 1.5px; }
      .cog-step-num { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 8px; font-weight: 700; fill: #00DFD8; }
      .cog-step-name { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 9.5px; font-weight: 700; fill: #FFFFFF; }
      .cog-step-detail { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 7.5px; fill: #8B949E; }
      
      .arrow-flow {
        animation: pulseArrow 1.5s ease-in-out infinite alternate;
      }
      .st-1 { animation: stageGlow 6s ease-in-out 0s infinite; }
      .st-2 { animation: stageGlow 6s ease-in-out 1.5s infinite; }
      .st-3 { animation: stageGlow 6s ease-in-out 3s infinite; }
      .st-4 { animation: stageGlow 6s ease-in-out 4.5s infinite; }

      @keyframes pulseArrow {
        0% { opacity: 0.3; transform: translateX(0px); }
        100% { opacity: 1; transform: translateX(3px); }
      }

      @keyframes stageGlow {
        0%, 100% { stroke: rgba(255, 255, 255, 0.1); }
        25% { stroke: #00DFD8; filter: drop-shadow(0 0 6px #00DFD8); }
        35% { stroke: rgba(255, 255, 255, 0.1); filter: none; }
      }
    </style>
  </defs>

  <!-- Card Frame with Chamfers -->
  <polygon points="12,2 888,2 898,12 898,108 888,118 12,118 2,108 2,12" fill="url(#cogBg)" stroke="url(#cogBorder)" stroke-width="1.2" />

  <!-- Top Title Bar -->
  <g transform="translate(20, 16)">
    <circle cx="6" cy="6" r="3.5" fill="#00DFD8" />
    <text x="18" y="9.5" class="cog-title">SIVION v2.4 // MULTI-AGENT COGNITIVE STATE MACHINE</text>
    <text x="860" y="9.5" text-anchor="end" class="cog-title" fill="#7701D0">4-STAGE AUTONOMOUS LOOP</text>
    <line x1="0" y1="18" x2="860" y2="18" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  </g>

  <!-- 4 Pipeline Stages with Sequential Illumination Loop -->

  <!-- Stage 1 -->
  <g transform="translate(25, 46)">
    <rect x="0" y="0" width="190" height="58" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(0, 223, 216, 0.3)" stroke-width="1.2" class="st-1" />
    <text x="12" y="18" class="cog-step-num">STAGE 01 // INGESTION</text>
    <text x="12" y="32" class="cog-step-name">Hybrid RAG Query</text>
    <text x="12" y="44" class="cog-step-detail">pgvector Semantic Search</text>
    <text x="12" y="52" class="cog-step-detail" fill="#00DFD8">&lt;10ms LATENCY PROBE</text>
  </g>

  <!-- Connector 1-2 -->
  <g transform="translate(222, 70)" class="arrow-flow">
    <text x="0" y="5" font-family="'Fira Code', monospace" font-size="14" fill="#00DFD8" font-weight="700">➔</text>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(245, 46)">
    <rect x="0" y="0" width="190" height="58" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(119, 1, 208, 0.3)" stroke-width="1.2" class="st-2" />
    <text x="12" y="18" class="cog-step-num" fill="#C084FC">STAGE 02 // REASONING</text>
    <text x="12" y="32" class="cog-step-name">Swarm Consensus</text>
    <text x="12" y="44" class="cog-step-detail">Planner + Critic Agents</text>
    <text x="12" y="52" class="cog-step-detail" fill="#A855F7">4/4 AGENTS ACTIVE</text>
  </g>

  <!-- Connector 2-3 -->
  <g transform="translate(442, 70)" class="arrow-flow">
    <text x="0" y="5" font-family="'Fira Code', monospace" font-size="14" fill="#A855F7" font-weight="700">➔</text>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(465, 46)">
    <rect x="0" y="0" width="190" height="58" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.2" class="st-3" />
    <text x="12" y="18" class="cog-step-num" fill="#34D399">STAGE 03 // EXECUTION</text>
    <text x="12" y="32" class="cog-step-name">Low-Latency Kernel</text>
    <text x="12" y="44" class="cog-step-detail">Win32 API &amp; C++20 Ring 0</text>
    <text x="12" y="52" class="cog-step-detail" fill="#10B981">&lt;0.42ms DISPATCH</text>
  </g>

  <!-- Connector 3-4 -->
  <g transform="translate(662, 70)" class="arrow-flow">
    <text x="0" y="5" font-family="'Fira Code', monospace" font-size="14" fill="#10B981" font-weight="700">➔</text>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(685, 46)">
    <rect x="0" y="0" width="190" height="58" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(2, 132, 199, 0.3)" stroke-width="1.2" class="st-4" />
    <text x="12" y="18" class="cog-step-num" fill="#38BDF8">STAGE 04 // REALTIME</text>
    <text x="12" y="32" class="cog-step-name">Supabase Stream</text>
    <text x="12" y="44" class="cog-step-detail">WebSocket + React 19 UI</text>
    <text x="12" y="52" class="cog-step-detail" fill="#0284C7">INSTANT STATE SYNC</text>
  </g>
</svg>
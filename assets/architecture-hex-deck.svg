<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="deckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131E" />
      <stop offset="100%" stop-color="#06090F" />
    </linearGradient>

    <linearGradient id="hexGlowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#007CF0" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="hexGlowPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7701D0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF007F" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="laserBeamVert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00DFD8" />
      <stop offset="50%" stop-color="#7701D0" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <style>
      .d-header { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 11px; font-weight: 700; fill: #00DFD8; letter-spacing: 2px; }
      .d-layer { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 11px; font-weight: 700; fill: #FFFFFF; }
      .d-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.5px; fill: #8B949E; }
      .d-tag { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 8px; font-weight: 700; letter-spacing: 1px; }
      
      .beam-pulse {
        animation: pulseLaser 2s infinite alternate;
      }
      @keyframes pulseLaser {
        0% { opacity: 0.4; stroke-width: 1.5; }
        100% { opacity: 1; stroke-width: 3; filter: drop-shadow(0 0 8px #00DFD8); }
      }
    </style>
  </defs>

  <!-- Frame Background with Chamfers -->
  <polygon points="16,2 884,2 898,16 898,204 884,218 16,218 2,204 2,16" fill="url(#deckBg)" stroke="url(#hexGlowCyan)" stroke-width="1.3" />

  <!-- Top Title Ribbon -->
  <g transform="translate(24, 18)">
    <circle cx="6" cy="6" r="3.5" fill="#00DFD8" />
    <text x="18" y="9.5" class="d-header">ISOMETRIC 3D ARCHITECTURE DECK // FULL-STACK ENGINE</text>
    <text x="850" y="9.5" text-anchor="end" class="d-header" fill="#7701D0">CROSS-LAYER SYNC</text>
    <line x1="0" y1="18" x2="850" y2="18" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  </g>

  <!-- LEFT: 3D Isometric Stacks (Center at 130, 125) -->
  <g id="isometric-layers">
    <!-- Connecting Elevation Laser Beams -->
    <line x1="70" y1="65" x2="70" y2="175" stroke="url(#laserBeamVert)" class="beam-pulse" />
    <line x1="190" y1="65" x2="190" y2="175" stroke="url(#laserBeamVert)" class="beam-pulse" />

    <!-- Layer 5 (Bottom): Kernel Base (Gold) -->
    <polygon points="130,150 190,165 130,180 70,165" fill="#18140B" stroke="#F59E0B" stroke-width="1.2" />
    <polygon points="70,165 130,180 130,186 70,171" fill="#B45309" opacity="0.6" />
    <polygon points="190,165 130,180 130,186 190,171" fill="#78350F" opacity="0.6" />

    <!-- Layer 4: Distributed Cloud (Emerald) -->
    <polygon points="130,125 190,140 130,155 70,140" fill="#0D1A15" stroke="#10B981" stroke-width="1.2" />
    <polygon points="70,140 130,155 130,160 70,145" fill="#047857" opacity="0.6" />
    <polygon points="190,140 130,155 130,160 190,145" fill="#064E3B" opacity="0.6" />

    <!-- Layer 3: Multi-Agent AI (Purple) -->
    <polygon points="130,100 190,115 130,130 70,115" fill="#1A0D26" stroke="#A855F7" stroke-width="1.2" />
    <polygon points="70,115 130,130 130,135 70,120" fill="#7E22CE" opacity="0.6" />
    <polygon points="190,115 130,130 130,135 190,120" fill="#581C87" opacity="0.6" />

    <!-- Layer 2: Concurrent UI (Blue) -->
    <polygon points="130,75 190,90 130,105 70,90" fill="#0C1424" stroke="#007CF0" stroke-width="1.2" />
    <polygon points="70,90 130,105 130,110 70,95" fill="#0369A1" opacity="0.6" />
    <polygon points="190,90 130,105 130,110 190,95" fill="#075985" opacity="0.6" />

    <!-- Layer 1 (Top): WebGL 2.0 / GLSL (Cyan) -->
    <polygon points="130,50 190,65 130,80 70,65" fill="#0B1C22" stroke="#00DFD8" stroke-width="1.5" />
    <polygon points="70,65 130,80 130,85 70,70" fill="#0891B2" opacity="0.7" />
    <polygon points="190,65 130,80 130,85 190,70" fill="#155E75" opacity="0.7" />
    <circle cx="130" cy="65" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- RIGHT: 5 Layer Architectural Spec -->
  <g transform="translate(260, 48)">
    <!-- Layer 1 -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="3" fill="#00DFD8" />
      <text x="18" y="9" class="d-layer">L1 // SPATIAL &amp; SHADERS:</text>
      <text x="210" y="9" class="d-desc">WebGL 2.0 • Three.js • GLSL Compute Shaders • 144 FPS @ 4K</text>
      <text x="590" y="9" text-anchor="end" class="d-tag" fill="#00DFD8">RENDER TIER</text>
    </g>

    <!-- Layer 2 -->
    <g transform="translate(0, 30)">
      <circle cx="6" cy="6" r="3" fill="#007CF0" />
      <text x="18" y="9" class="d-layer">L2 // CONCURRENT UI:</text>
      <text x="210" y="9" class="d-desc">Next.js 16 (Turbopack) • React 19 • TypeScript 5 Strict</text>
      <text x="590" y="9" text-anchor="end" class="d-tag" fill="#007CF0">INTERACTION</text>
    </g>

    <!-- Layer 3 -->
    <g transform="translate(0, 60)">
      <circle cx="6" cy="6" r="3" fill="#A855F7" />
      <text x="18" y="9" class="d-layer">L3 // AGENTIC INTELLIGENCE:</text>
      <text x="210" y="9" class="d-desc">SIVION Multi-Agent Swarms • pgvector Hybrid RAG • Python</text>
      <text x="590" y="9" text-anchor="end" class="d-tag" fill="#C4B5FD">COGNITION</text>
    </g>

    <!-- Layer 4 -->
    <g transform="translate(0, 90)">
      <circle cx="6" cy="6" r="3" fill="#10B981" />
      <text x="18" y="9" class="d-layer">L4 // DISTRIBUTED BACKEND:</text>
      <text x="210" y="9" class="d-desc">FastAPI Async • Bun Runtime • Supabase Realtime • Docker</text>
      <text x="590" y="9" text-anchor="end" class="d-tag" fill="#34D399">INFRASTRUCTURE</text>
    </g>

    <!-- Layer 5 -->
    <g transform="translate(0, 120)">
      <circle cx="6" cy="6" r="3" fill="#F59E0B" />
      <text x="18" y="9" class="d-layer">L5 // LOW-LATENCY KERNEL:</text>
      <text x="210" y="9" class="d-desc">MA-Optimizer • C++20 • Windows API • 0.42ms Sub-Millisecond</text>
      <text x="590" y="9" text-anchor="end" class="d-tag" fill="#FBBF24">KERNEL RING 0</text>
    </g>
  </g>
</svg>
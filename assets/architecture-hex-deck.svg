<svg width="900" height="150" viewBox="0 0 900 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hexDeckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131E" />
      <stop offset="100%" stop-color="#06090F" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="hexDeckBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7701D0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.8" />
    </linearGradient>

    <style>
      .h-title { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 10px; font-weight: 700; fill: #00DFD8; letter-spacing: 1.5px; }
      .h-layer-tag { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 8.5px; font-weight: 700; }
      .h-layer-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9px; fill: #C9D1D9; }
      .h-meta { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 7.5px; fill: #8B949E; }
      
      .laser-line { stroke-dasharray: 4, 4; animation: laserFlow 1.2s linear infinite; }
      
      .iso-layer-1 { animation: isoFloat 3.5s ease-in-out 0s infinite alternate; }
      .iso-layer-2 { animation: isoFloat 3.5s ease-in-out 0.4s infinite alternate; }
      .iso-layer-3 { animation: isoFloat 3.5s ease-in-out 0.8s infinite alternate; }
      .iso-layer-4 { animation: isoFloat 3.5s ease-in-out 1.2s infinite alternate; }
      .iso-layer-5 { animation: isoFloat 3.5s ease-in-out 1.6s infinite alternate; }

      @keyframes laserFlow {
        from { stroke-dashoffset: 8; }
        to { stroke-dashoffset: 0; }
      }

      @keyframes isoFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-2px); }
      }
    </style>
  </defs>

  <!-- Card Frame with Chamfers -->
  <polygon points="12,2 888,2 898,12 898,138 888,148 12,148 2,138 2,12" fill="url(#hexDeckBg)" stroke="url(#hexDeckBorder)" stroke-width="1.2" />

  <!-- Top Title Ribbon -->
  <g transform="translate(20, 16)">
    <circle cx="6" cy="6" r="3.5" fill="#7701D0" />
    <text x="18" y="9.5" class="h-title">ISOMETRIC 3D ARCHITECTURE DECK // FULL-STACK ENGINE</text>
    <text x="860" y="9.5" text-anchor="end" class="h-title" fill="#00DFD8">CROSS-LAYER SYNC</text>
    <line x1="0" y1="18" x2="860" y2="18" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  </g>

  <!-- 3D Isometric Platforms (Left) with Layer Animation -->
  <g transform="translate(60, 48)">
    <!-- Vertical Connecting Laser Beams -->
    <line x1="120" y1="10" x2="120" y2="85" stroke="#00DFD8" stroke-width="1.2" class="laser-line" />
    <line x1="180" y1="18" x2="180" y2="92" stroke="#7701D0" stroke-width="1.2" class="laser-line" />
    <line x1="60" y1="18" x2="60" y2="92" stroke="#10B981" stroke-width="1.2" class="laser-line" />

    <!-- L1: Spatial & Shaders (Top) -->
    <g class="iso-layer-1">
      <polygon points="120,5 190,18 120,31 50,18" fill="rgba(0, 223, 216, 0.25)" stroke="#00DFD8" stroke-width="1.2" />
    </g>
    <!-- L2: Concurrent UI -->
    <g class="iso-layer-2">
      <polygon points="120,20 190,33 120,46 50,33" fill="rgba(0, 124, 240, 0.25)" stroke="#007CF0" stroke-width="1.2" />
    </g>
    <!-- L3: Agentic Intelligence -->
    <g class="iso-layer-3">
      <polygon points="120,35 190,48 120,61 50,48" fill="rgba(119, 1, 208, 0.25)" stroke="#7701D0" stroke-width="1.2" />
    </g>
    <!-- L4: Distributed Backend -->
    <g class="iso-layer-4">
      <polygon points="120,50 190,63 120,76 50,63" fill="rgba(16, 185, 129, 0.25)" stroke="#10B981" stroke-width="1.2" />
    </g>
    <!-- L5: Low-Latency Kernel (Base) -->
    <g class="iso-layer-5">
      <polygon points="120,65 190,78 120,91 50,78" fill="rgba(245, 158, 11, 0.25)" stroke="#F59E0B" stroke-width="1.2" />
    </g>
  </g>

  <!-- Architectural Stack Breakdown (Right) -->
  <g transform="translate(300, 42)">
    <!-- L1 Description -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="3" fill="#00DFD8" />
      <text x="18" y="9" class="h-layer-tag" fill="#00DFD8">L1 // SPATIAL &amp; SHADERS:</text>
      <text x="175" y="9" class="h-layer-name">WebGL 2.0 • Three.js • GLSL Compute Shaders • 144 FPS @ 4K</text>
      <text x="560" y="9" class="h-meta" fill="#00DFD8">RENDER TIER</text>
    </g>
    <!-- L2 Description -->
    <g transform="translate(0, 18)">
      <circle cx="6" cy="6" r="3" fill="#007CF0" />
      <text x="18" y="9" class="h-layer-tag" fill="#38BDF8">L2 // CONCURRENT UI:</text>
      <text x="175" y="9" class="h-layer-name">Next.js 16 (Turbopack) • React 19 • TypeScript 5 (Strict)</text>
      <text x="560" y="9" class="h-meta" fill="#38BDF8">INTERACTION</text>
    </g>
    <!-- L3 Description -->
    <g transform="translate(0, 36)">
      <circle cx="6" cy="6" r="3" fill="#7701D0" />
      <text x="18" y="9" class="h-layer-tag" fill="#C084FC">L3 // AGENTIC INTELLIGENCE:</text>
      <text x="175" y="9" class="h-layer-name">SIVION Multi-Agent Swarms • pgvector Hybrid RAG • Python</text>
      <text x="560" y="9" class="h-meta" fill="#C084FC">COGNITION</text>
    </g>
    <!-- L4 Description -->
    <g transform="translate(0, 54)">
      <circle cx="6" cy="6" r="3" fill="#10B981" />
      <text x="18" y="9" class="h-layer-tag" fill="#34D399">L4 // DISTRIBUTED BACKEND:</text>
      <text x="175" y="9" class="h-layer-name">FastAPI Async • Bun Runtime • Supabase Realtime • Docker</text>
      <text x="560" y="9" class="h-meta" fill="#34D399">INFRASTRUCTURE</text>
    </g>
    <!-- L5 Description -->
    <g transform="translate(0, 72)">
      <circle cx="6" cy="6" r="3" fill="#F59E0B" />
      <text x="18" y="9" class="h-layer-tag" fill="#FBBF24">L5 // LOW-LATENCY KERNEL:</text>
      <text x="175" y="9" class="h-layer-name">MA-Optimizer • C++20 • Windows API • 0.42ms Sub-Millisecond</text>
      <text x="560" y="9" class="h-meta" fill="#FBBF24">KERNEL RING 0</text>
    </g>
  </g>
</svg>
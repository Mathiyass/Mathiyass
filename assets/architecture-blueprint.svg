<svg width="900" height="250" viewBox="0 0 900 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradSupreme" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121B" />
      <stop offset="100%" stop-color="#06080E" />
    </linearGradient>

    <linearGradient id="cyanBorderSupreme" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7701D0" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="nodeGradSupreme" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151B26" />
      <stop offset="100%" stop-color="#0C0F15" />
    </linearGradient>

    <!-- Marker Arrowheads -->
    <marker id="arrCyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00DFD8" />
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7701D0" />
    </marker>

    <style>
      .bp-header { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 11px; font-weight: 700; fill: #00DFD8; letter-spacing: 2px; }
      .n-title { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 11.5px; font-weight: 700; fill: #FFFFFF; }
      .n-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.5px; fill: #8B949E; }
      .bus-label { font-family: 'Fira Code', 'SF Mono', monospace; font-size: 7.5px; font-weight: 700; fill: #00DFD8; letter-spacing: 1px; }
      
      .laser-track {
        stroke-dasharray: 6, 8;
        animation: flowDash 1.2s linear infinite;
      }
      .laser-track-rev {
        stroke-dasharray: 6, 8;
        animation: flowDashRev 1.2s linear infinite;
      }
      .beacon {
        animation: beaconGlow 2s ease-in-out infinite alternate;
      }
      .packet {
        animation: packetPulse 1.5s ease-in-out infinite;
      }

      @keyframes flowDash {
        from { stroke-dashoffset: 28; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowDashRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 28; }
      }
      @keyframes beaconGlow {
        0% { opacity: 0.3; transform: scale(1); }
        100% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 5px #00DFD8); }
      }
      @keyframes packetPulse {
        0%, 100% { r: 3.5; opacity: 0.7; }
        50% { r: 5.5; opacity: 1; filter: drop-shadow(0 0 6px #00DFD8); }
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <polygon points="16,2 884,2 898,16 898,234 884,248 16,248 2,234 2,16" fill="url(#bgGradSupreme)" stroke="url(#cyanBorderSupreme)" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <path d="M 20 28 L 30 18 L 260 18 L 270 28" fill="none" stroke="#00DFD8" stroke-width="1.5" />
  <circle cx="280" cy="23" r="3.5" fill="#10B981" class="beacon" />
  <text x="35" y="26" class="bp-header">SYSTEM ARCHITECTURE BLUEPRINT // KINETIC FLOW</text>

  <!-- Base Connection Lines & Buses -->
  <!-- Bus 1 -> 2 -->
  <line x1="280" y1="88" x2="325" y2="88" stroke="#00DFD8" stroke-width="2" class="laser-track" marker-end="url(#arrCyan)" />
  <text x="302" y="80" text-anchor="middle" class="bus-label">pgvector</text>

  <!-- Bus 2 -> 3 -->
  <line x1="565" y1="88" x2="610" y2="88" stroke="#7701D0" stroke-width="2" class="laser-track" marker-end="url(#arrPurple)" />
  <text x="587" y="80" text-anchor="middle" class="bus-label" fill="#C4B5FD">gRPC / API</text>

  <!-- Vertical Bus 3 down to 6 -->
  <path d="M 735 125 L 735 155" stroke="#7701D0" stroke-width="2" class="laser-track" marker-end="url(#arrPurple)" />
  <text x="748" y="142" class="bus-label" fill="#C4B5FD">SYNC</text>

  <!-- Bus 6 -> 5 -->
  <line x1="610" y1="192" x2="565" y2="192" stroke="#00DFD8" stroke-width="2" class="laser-track-rev" marker-end="url(#arrCyan)" />
  <text x="587" y="184" text-anchor="middle" class="bus-label">WS Realtime</text>

  <!-- Bus 5 -> 4 -->
  <line x1="325" y1="192" x2="280" y2="192" stroke="#00DFD8" stroke-width="2" class="laser-track-rev" marker-end="url(#arrCyan)" />
  <text x="302" y="184" text-anchor="middle" class="bus-label">GLSL Buffer</text>

  <!-- Kinetic Data Packets Moving Along Paths -->
  <circle cx="302" cy="88" r="4" fill="#00DFD8" class="packet" />
  <circle cx="587" cy="88" r="4" fill="#7701D0" class="packet" />
  <circle cx="735" cy="140" r="4" fill="#7701D0" class="packet" />
  <circle cx="587" cy="192" r="4" fill="#00DFD8" class="packet" />
  <circle cx="302" cy="192" r="4" fill="#00DFD8" class="packet" />

  <!-- NODES ROW 1 -->
  <!-- Node 1: AI Agents -->
  <g transform="translate(40, 52)">
    <polygon points="6,0 234,0 240,6 240,66 234,72 6,72 0,66 0,6" fill="url(#nodeGradSupreme)" stroke="rgba(0, 223, 216, 0.6)" stroke-width="1.2" />
    <circle cx="18" cy="24" r="4.5" fill="#00DFD8" class="beacon" />
    <text x="32" y="27" class="n-title">MULTI-AGENT AI CORE</text>
    <text x="14" y="47" class="n-desc">Autonomous LLM Swarms • Tool Orchestration</text>
    <text x="14" y="61" class="n-desc">Low-Latency Decision &amp; Feedback Loops</text>
  </g>

  <!-- Node 2: RAG & Vector -->
  <g transform="translate(325, 52)">
    <polygon points="6,0 234,0 240,6 240,66 234,72 6,72 0,66 0,6" fill="url(#nodeGradSupreme)" stroke="rgba(0, 223, 216, 0.5)" stroke-width="1.2" />
    <circle cx="18" cy="24" r="4.5" fill="#00DFD8" />
    <text x="32" y="27" class="n-title">VECTOR EMBEDDINGS &amp; RAG</text>
    <text x="14" y="47" class="n-desc">Hybrid Semantic Search • pgvector DB</text>
    <text x="14" y="61" class="n-desc">Context-Aware Neural Knowledge Graphs</text>
  </g>

  <!-- Node 3: Distributed Backend -->
  <g transform="translate(610, 52)">
    <polygon points="6,0 244,0 250,6 250,66 244,72 6,72 0,66 0,6" fill="url(#nodeGradSupreme)" stroke="rgba(119, 1, 208, 0.6)" stroke-width="1.2" />
    <circle cx="18" cy="24" r="4.5" fill="#7701D0" class="beacon" />
    <text x="32" y="27" class="n-title">DISTRIBUTED CLOUD ENGINE</text>
    <text x="14" y="47" class="n-desc">FastAPI Async • Node.js / Bun Runtime</text>
    <text x="14" y="61" class="n-desc">Docker • Microservices • Low Latency</text>
  </g>

  <!-- NODES ROW 2 -->
  <!-- Node 4: WebGL 3D Shaders -->
  <g transform="translate(40, 156)">
    <polygon points="6,0 234,0 240,6 240,66 234,72 6,72 0,66 0,6" fill="url(#nodeGradSupreme)" stroke="rgba(0, 223, 216, 0.6)" stroke-width="1.2" />
    <circle cx="18" cy="24" r="4.5" fill="#00DFD8" class="beacon" />
    <text x="32" y="27" class="n-title">WEBGL 2.0 &amp; GLSL SHADERS</text>
    <text x="14" y="47" class="n-desc">Three.js • GPGPU Compute • 3D Spatial</text>
    <text x="14" y="61" class="n-desc">Interactive Tactical Graphics Engine</text>
  </g>

  <!-- Node 5: React 19 Concurrent UI -->
  <g transform="translate(325, 156)">
    <polygon points="6,0 234,0 240,6 240,66 234,72 6,72 0,66 0,6" fill="url(#nodeGradSupreme)" stroke="rgba(0, 223, 216, 0.5)" stroke-width="1.2" />
    <circle cx="18" cy="24" r="4.5" fill="#00DFD8" />
    <text x="32" y="27" class="n-title">CONCURRENT UI ARCHITECTURE</text>
    <text x="14" y="47" class="n-desc">Next.js 16 (Turbopack) • React 19</text>
    <text x="14" y="61" class="n-desc">TypeScript 5 • Tailwind CSS • Zero Jitter</text>
  </g>

  <!-- Node 6: Realtime DB -->
  <g transform="translate(610, 156)">
    <polygon points="6,0 244,0 250,6 250,66 244,72 6,72 0,66 0,6" fill="url(#nodeGradSupreme)" stroke="rgba(119, 1, 208, 0.6)" stroke-width="1.2" />
    <circle cx="18" cy="24" r="4.5" fill="#7701D0" class="beacon" />
    <text x="32" y="27" class="n-title">STORAGE &amp; REALTIME STREAM</text>
    <text x="14" y="47" class="n-desc">PostgreSQL • Supabase • Redis Caching</text>
    <text x="14" y="61" class="n-desc">Instant Sync • Multi-Region Resiliency</text>
  </g>
</svg>
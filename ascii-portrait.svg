<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .bg { fill: #0D1117; }
      .text { 
        font-family: 'Courier New', Courier, monospace; 
        font-size: 14px; 
        fill: #c9d1d9; 
        white-space: pre;
      }
      .prompt { fill: #7ee787; font-weight: bold; }
      .cursor { 
        fill: #c9d1d9;
        animation: blink 1s step-end infinite;
      }
      .window { fill: #161b22; rx: 10; ry: 10; stroke: #30363d; stroke-width: 1; }
      .btn-red { fill: #ff5f56; }
      .btn-yel { fill: #ffbd2e; }
      .btn-grn { fill: #27c93f; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; text-anchor: middle; }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>
  
  <!-- Window Background -->
  <rect class="window" x="10" y="10" width="780" height="580" />
  <rect class="bg" x="10" y="40" width="780" height="550" rx="0" ry="0" />
  
  <!-- Window Controls -->
  <circle class="btn-red" cx="30" cy="25" r="6" />
  <circle class="btn-yel" cx="50" cy="25" r="6" />
  <circle class="btn-grn" cx="70" cy="25" r="6" />
  <text class="title" x="400" y="29">mathiya@github: ~ $ ./portrait.sh</text>

  <!-- ASCII Art -->
  <text class="text" x="50" y="70">
    <tspan x="200" dy="1.2em">               .,-:;//;:=,               </tspan>
    <tspan x="200" dy="1.2em">          . :H@@@MM@M#H/.,+%;,           </tspan>
    <tspan x="200" dy="1.2em">       ,/X+ +M@@M@MM%=,-%HMMM@X/,        </tspan>
    <tspan x="200" dy="1.2em">     -+@MM; $M@@MH+-,;XMMMM@MMMM@+-      </tspan>
    <tspan x="200" dy="1.2em">    ;@M@@M- XM@X;. -+XXXXXHHH@M@M#@/.    </tspan>
    <tspan x="200" dy="1.2em">  ,%MM@@MH ,@%=             .---=-=:=,.  </tspan>
    <tspan x="200" dy="1.2em">  =@#@@@MX.,                -%HX$$%%%:;  </tspan>
    <tspan x="200" dy="1.2em"> =-./@M@M$                   .;@MMMM@MM: </tspan>
    <tspan x="200" dy="1.2em"> X@/ -$MM/                    . +MM@@@M$ </tspan>
    <tspan x="200" dy="1.2em">,@M@H: :@:                    . =X#@@@@- </tspan>
    <tspan x="200" dy="1.2em">,@@@MMX, .                    /H- ;@M@M= </tspan>
    <tspan x="200" dy="1.2em">.H@@@@M@+,                    %MM+..%#$. </tspan>
    <tspan x="200" dy="1.2em"> /MMMM@MMH/.                  XM@MH; =;  </tspan>
    <tspan x="200" dy="1.2em">  /%+%$XHH@$=              , .H@@@@MX,   </tspan>
    <tspan x="200" dy="1.2em">   .=--------.           -%H.,@@@@@MX,   </tspan>
    <tspan x="200" dy="1.2em">   .%MM@@@HHHXX$$$%+- .:$MMX =M@@MM%.    </tspan>
    <tspan x="200" dy="1.2em">     =XMMM@MM@MM#H;,-+HMM@M+ /MMMX=      </tspan>
    <tspan x="200" dy="1.2em">       =%@M@M#@$-.=$@MM@@@M; %M%=        </tspan>
    <tspan x="200" dy="1.2em">         ,:+$+-,/H#MMMMMMM@= =,          </tspan>
    <tspan x="200" dy="1.2em">               =++%%%%+/:-.              </tspan>
  </text>

  <!-- Animated Prompt -->
  <g transform="translate(30, 540)">
    <text class="text">
      <tspan class="prompt">mathiya@github</tspan>:<tspan fill="#79c0ff">~</tspan>$ whoami
    </text>
    <text class="text" x="0" y="25">
      <tspan fill="#a5d6ff">> System Architect | Full-Stack Engineer</tspan> <tspan class="cursor">█</tspan>
    </text>
  </g>
</svg>
